<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ user.username }} - 3D Galeri</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        #blocker {
            position: absolute; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.8);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            color: white; font-family: sans-serif; text-align: center;
            z-index: 10;
        }
        #instructions {
            cursor: pointer;
            padding: 30px 40px; border: 1px solid rgba(255,255,255,0.2); border-radius: 16px;
            background: rgba(255,255,255,0.05);
            display: inline-block; margin: 0 auto;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }
        #instructions:hover {
            background: rgba(255,255,255,0.1);
            border-color: rgba(255,255,255,0.4);
            transform: scale(1.02);
        }
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            width: 8px; height: 8px;
            background-color: rgba(255,255,255,0.8);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 5;
            display: none;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        #back-btn {
            position: absolute; top: 20px; left: 20px;
            z-index: 20;
        }
    </style>
</head>
<body>
    <button id="back-btn" onclick="if(document.referrer) { history.back(); } else { window.location.href='{{ url_for('users.profile', username=user.username) }}'; }" class="px-5 py-2.5 bg-white/10 hover:bg-white/20 text-white rounded-xl backdrop-blur-md transition-all font-bold text-xs tracking-widest uppercase border border-white/10 shadow-lg cursor-pointer">
        &larr; Profile Dön
    </button>
    <button id="cam-toggle-btn" class="px-3 py-2.5 bg-white/10 hover:bg-white/20 text-white rounded-xl backdrop-blur-md transition-all font-bold text-xs tracking-widest uppercase border border-white/10 shadow-lg cursor-pointer flex items-center justify-center gap-2" style="position: absolute; top: 20px; right: 20px; z-index: 20;" title="Bakış Açısını Değiştir (C)">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
        <span class="hidden md:inline">Bakış Açısı (C)</span>
    </button>
    <div id="blocker">
        <div id="instructions">
            <span style="font-size:36px; font-weight:800; letter-spacing: -1px; display:block; margin-bottom: 20px;">{{ user.username }} <span class="text-emerald-500">3D Galerisi</span></span>
            <div class="text-emerald-400 font-bold tracking-widest text-sm mb-8 uppercase animate-pulse">Başlamak için tıklayın</div>
            <div class="grid grid-cols-2 gap-x-12 gap-y-4 text-left text-sm text-gray-300 font-medium">
                <div><strong class="text-white">Hareket:</strong> W, A, S, D</div>
                <div><strong class="text-white">Etrafı İncele:</strong> Mouse</div>
                <div><strong class="text-white">Bakış Açısı:</strong> C tuşu</div>
                <div><strong class="text-white">Çıkış:</strong> ESC tuşu</div>
            </div>
        </div>
    </div>
    
    <div id="crosshair"></div>
    <div id="error-box" style="position:fixed; top:80px; left:20px; z-index:9999; background:rgba(220,0,0,0.9); color:white; padding:15px; border-radius:8px; font-family:monospace; display:none; max-width: 80%;"></div>

    <script>
    window.addEventListener('error', function(e) {
        const eb = document.getElementById('error-box');
        eb.style.display = 'block';
        eb.innerHTML += "Hata: " + e.message + " (" + e.filename + ":" + e.lineno + ")<br>";
    });
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>
    <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || navigator.maxTouchPoints > 0;

        const photosData = {{ photos_json | safe }};
        
        let camera, tpCamera, scene, renderer, controls;
        let isThirdPerson = true;
        let moveForward = false;
        let moveBackward = false;
        let moveLeft = false;
        let moveRight = false;
        let prevTime = performance.now();
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();

        // Mobile control variables
        let fwdValue = 0;
        let bkdValue = 0;
        let rgtValue = 0;
        let lftValue = 0;
        let touchLook = { x: 0, y: 0 };
        let previousTouchLook = { x: 0, y: 0 };
        let lon = -90, lat = 0;
        let phi = 0, theta = 0;
        
        // Gallery dimensions
        const roomWidth = 40;
        const roomHeight = 20;
        const zSpacing = 30; // Distance between photos
        const totalZ = Math.max(100, Math.ceil(photosData.length / 2) * zSpacing + 80);

        // Obstacles array for collision
        const obstacles = [];

        // Avatar variables
        let avatarGroup;
        let avatarMixer;
        let currentAction;

        init();
        animate();

        function createTextTexture(photo) {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 1024;
            const ctx = canvas.getContext('2d');
            
            // Background
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Border
            ctx.strokeStyle = '#222222';
            ctx.lineWidth = 10;
            ctx.strokeRect(5, 5, canvas.width - 10, canvas.height - 10);
            
            ctx.fillStyle = '#111111';
            ctx.textAlign = 'left';
            
            // Title
            ctx.font = 'bold 70px sans-serif';
            ctx.fillText(photo.title || 'İsimsiz', 60, 120);
            
            // Description (word wrap)
            ctx.font = '40px sans-serif';
            const desc = photo.description || '';
            const words = desc.split(' ');
            let line = '';
            let y = 200;
            for(let n = 0; n < words.length; n++) {
                let testLine = line + words[n] + ' ';
                let metrics = ctx.measureText(testLine);
                if (metrics.width > canvas.width - 120 && n > 0) {
                    ctx.fillText(line, 60, y);
                    line = words[n] + ' ';
                    y += 55;
                } else {
                    line = testLine;
                }
            }
            ctx.fillText(line, 60, y);
            
            // EXIF Info
            y += 100;
            ctx.font = 'bold 40px monospace';
            ctx.fillStyle = '#444444';
            if (photo.camera_model) { ctx.fillText(`Kamera: ${photo.camera_model}`, 60, y); y += 60; }
            if (photo.lens_model) { ctx.fillText(`Lens: ${photo.lens_model}`, 60, y); y += 60; }
            if (photo.iso) { ctx.fillText(`ISO: ${photo.iso}`, 60, y); y += 60; }
            if (photo.aperture) { ctx.fillText(`Diyafram: ${photo.aperture}`, 60, y); y += 60; }
            if (photo.shutter_speed) { ctx.fillText(`Enstantane: ${photo.shutter_speed}`, 60, y); y += 60; }
            
            const texture = new THREE.CanvasTexture(canvas);
            return texture;
        }

        function createWallTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imgData.data;
            for(let i = 0; i < data.length; i += 4) {
                // Daha belirgin sıva/duvar efekti için gürültüyü artırdık
                const noise = Math.random() * 35; 
                data[i] = Math.max(0, data[i] - noise);
                data[i+1] = Math.max(0, data[i+1] - noise);
                data[i+2] = Math.max(0, data[i+2] - noise);
            }
            ctx.putImageData(imgData, 0, 0);
            
            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            return texture;
        }

        function init() {
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 1000);
            camera.position.y = 8;
            camera.position.z = 20;

            tpCamera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 1000);

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xf5f5f5);
            scene.fog = new THREE.Fog(0xf5f5f5, 10, Math.min(150, totalZ));

            const light = new THREE.HemisphereLight(0xffffff, 0xdddddd, 0.6);
            scene.add(light);

            function loadAvatar() {
                avatarGroup = new THREE.Group();
                scene.add(avatarGroup);
                
                const loader = new GLTFLoader();
                loader.load('{{ url_for("static", filename="models/angel_character_model.glb") }}', function (gltf) {
                    const model = gltf.scene;
                    
                    // Adjust scale and position based on the mushroom_dance model
                    model.scale.set(4.0, 4.0, 4.0); // Increase size if necessary, you can adjust this later
                    model.position.set(0, 0, 0);
                    
                    // Add shadow casting
                    model.traverse(function(node) {
                        if (node.isMesh) {
                            node.castShadow = true;
                            node.receiveShadow = true;
                        }
                    });
                    
                    avatarGroup.add(model);
                    
                    // Setup animations
                    if (gltf.animations && gltf.animations.length > 0) {
                        avatarMixer = new THREE.AnimationMixer(model);
                        // Play the first animation (likely the dance)
                        currentAction = avatarMixer.clipAction(gltf.animations[0]);
                        currentAction.play();
                    }
                }, undefined, function (error) {
                    console.error('An error happened while loading the avatar:', error);
                });
            }

            loadAvatar();

            if (!isMobile) {
                controls = new PointerLockControls(camera, document.body);
                
                const blocker = document.getElementById('blocker');
                const instructions = document.getElementById('instructions');
                const crosshair = document.getElementById('crosshair');

                instructions.addEventListener('click', function() {
                    controls.lock();
                });

                controls.addEventListener('lock', function() {
                    instructions.style.display = 'none';
                    blocker.style.display = 'none';
                    crosshair.style.display = 'block';
                });

                controls.addEventListener('unlock', function() {
                    blocker.style.display = 'flex';
                    instructions.style.display = '';
                    crosshair.style.display = 'none';
                });

                scene.add(controls.getObject());

                const onKeyDown = function (event) {
                    switch (event.code) {
                        case 'ArrowUp': case 'KeyW': moveForward = true; break;
                        case 'ArrowLeft': case 'KeyA': moveLeft = true; break;
                        case 'ArrowDown': case 'KeyS': moveBackward = true; break;
                        case 'ArrowRight': case 'KeyD': moveRight = true; break;
                        case 'KeyC': isThirdPerson = !isThirdPerson; break;
                    }
                };

                const onKeyUp = function (event) {
                    switch (event.code) {
                        case 'ArrowUp': case 'KeyW': moveForward = false; break;
                        case 'ArrowLeft': case 'KeyA': moveLeft = false; break;
                        case 'ArrowDown': case 'KeyS': moveBackward = false; break;
                        case 'ArrowRight': case 'KeyD': moveRight = false; break;
                    }
                };

                document.addEventListener('keydown', onKeyDown);
                document.addEventListener('keyup', onKeyUp);
            } else {
                // Mobile Setup
                document.getElementById('instructions').style.display = 'none';
                document.getElementById('blocker').style.display = 'none';
                document.getElementById('crosshair').style.display = 'none';

                const joystickZone = document.createElement('div');
                joystickZone.style.position = 'absolute';
                joystickZone.style.bottom = '50px';
                joystickZone.style.left = '50px';
                joystickZone.style.width = '120px';
                joystickZone.style.height = '120px';
                joystickZone.style.zIndex = '100';
                document.body.appendChild(joystickZone);

                const manager = nipplejs.create({
                    zone: joystickZone,
                    mode: 'static',
                    position: { left: '50%', top: '50%' },
                    color: 'white',
                    size: 100
                });

                manager.on('move', function (evt, data) {
                    const forward = data.vector.y;
                    const turn = data.vector.x;

                    if (forward > 0) { fwdValue = Math.abs(forward); bkdValue = 0; }
                    else if (forward < 0) { fwdValue = 0; bkdValue = Math.abs(forward); }
                    
                    if (turn > 0) { rgtValue = Math.abs(turn); lftValue = 0; }
                    else if (turn < 0) { rgtValue = 0; lftValue = Math.abs(turn); }
                });

                manager.on('end', function () {
                    fwdValue = 0; bkdValue = 0; lftValue = 0; rgtValue = 0;
                });

                document.body.addEventListener('touchstart', function(e) {
                    for(let i=0; i<e.changedTouches.length; i++) {
                        if(e.changedTouches[i].clientX > window.innerWidth / 2) {
                            previousTouchLook.x = e.changedTouches[i].clientX;
                            previousTouchLook.y = e.changedTouches[i].clientY;
                        }
                    }
                }, {passive: false});

                document.body.addEventListener('touchmove', function(e) {
                    for(let i=0; i<e.changedTouches.length; i++) {
                        if(e.changedTouches[i].clientX > window.innerWidth / 2) {
                            let movementX = e.changedTouches[i].clientX - previousTouchLook.x;
                            let movementY = e.changedTouches[i].clientY - previousTouchLook.y;
                            
                            lon += movementX * 0.4;
                            lat -= movementY * 0.4;
                            lat = Math.max(-85, Math.min(85, lat));

                            previousTouchLook.x = e.changedTouches[i].clientX;
                            previousTouchLook.y = e.changedTouches[i].clientY;
                        }
                    }
                }, {passive: false});
            }

            // Floor (Zemin koyu beton/granit rengi yapıldı)
            const floorGeo = new THREE.PlaneGeometry(roomWidth, totalZ);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x2c2c2c, roughness: 0.5, metalness: 0.2 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.position.z = -totalZ / 2 + 40;
            floor.receiveShadow = true;
            scene.add(floor);
            
            // Red Carpet
            const carpetWidth = 6;
            const carpetGeo = new THREE.PlaneGeometry(carpetWidth, totalZ);
            
            const carpetCanvas = document.createElement('canvas');
            carpetCanvas.width = 512;
            carpetCanvas.height = 512;
            const cCtx = carpetCanvas.getContext('2d');
            
            cCtx.fillStyle = '#7a0000'; // Dark red
            cCtx.fillRect(0, 0, 512, 512);
            
            // Gold borders
            cCtx.fillStyle = '#d4af37';
            cCtx.fillRect(20, 0, 15, 512);
            cCtx.fillRect(477, 0, 15, 512);
            
            // Central subtle diamond pattern
            cCtx.strokeStyle = '#520000';
            cCtx.lineWidth = 6;
            for(let i = 0; i <= 512; i += 64) {
                cCtx.beginPath();
                cCtx.moveTo(256, i);
                cCtx.lineTo(320, i + 32);
                cCtx.lineTo(256, i + 64);
                cCtx.lineTo(192, i + 32);
                cCtx.closePath();
                cCtx.stroke();
            }
            
            const carpetTex = new THREE.CanvasTexture(carpetCanvas);
            carpetTex.wrapS = THREE.RepeatWrapping;
            carpetTex.wrapT = THREE.RepeatWrapping;
            carpetTex.repeat.set(1, totalZ / 10); // scale pattern
            
            const carpetMat = new THREE.MeshStandardMaterial({ 
                color: 0xffffff,
                map: carpetTex, 
                roughness: 0.95, 
                metalness: 0.0
            });
            const carpet = new THREE.Mesh(carpetGeo, carpetMat);
            carpet.rotation.x = -Math.PI / 2;
            carpet.position.z = -totalZ / 2 + 40;
            carpet.position.y = 0.02; // Z-fighting prevention
            carpet.receiveShadow = true;
            scene.add(carpet);
            
            // Ceiling
            const ceilGeo = new THREE.PlaneGeometry(roomWidth, totalZ);
            const ceilMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1 });
            const ceiling = new THREE.Mesh(ceilGeo, ceilMat);
            ceiling.rotation.x = Math.PI / 2;
            ceiling.position.y = roomHeight;
            ceiling.position.z = -totalZ / 2 + 40;
            scene.add(ceiling);

            // Walls
            const wallTexture = createWallTexture();
            wallTexture.repeat.set(totalZ / 20, roomHeight / 20); // Scale the texture
            
            const wallMat = new THREE.MeshStandardMaterial({ 
                color: 0xffffff, 
                roughness: 1.0,
                map: wallTexture,
                bumpMap: wallTexture,
                bumpScale: 0.4
            });
            const wallGeo = new THREE.PlaneGeometry(totalZ, roomHeight);
            
            // Left Wall
            const leftWall = new THREE.Mesh(wallGeo, wallMat);
            leftWall.rotation.y = Math.PI / 2;
            leftWall.position.x = -roomWidth / 2;
            leftWall.position.y = roomHeight / 2;
            leftWall.position.z = -totalZ / 2 + 40;
            scene.add(leftWall);

            // Right Wall
            const rightWall = new THREE.Mesh(wallGeo, wallMat);
            rightWall.rotation.y = -Math.PI / 2;
            rightWall.position.x = roomWidth / 2;
            rightWall.position.y = roomHeight / 2;
            rightWall.position.z = -totalZ / 2 + 40;
            scene.add(rightWall);
            
            // Back Wall
            const backWallGeo = new THREE.PlaneGeometry(roomWidth, roomHeight);
            
            const backWallTexture = wallTexture.clone();
            backWallTexture.repeat.set(roomWidth / 20, roomHeight / 20);
            const backWallMat = new THREE.MeshStandardMaterial({
                color: 0xffffff, roughness: 1.0, map: backWallTexture, bumpMap: backWallTexture, bumpScale: 0.4
            });

            const backWall = new THREE.Mesh(backWallGeo, backWallMat);
            backWall.position.z = -totalZ + 40;
            backWall.position.y = roomHeight / 2;
            scene.add(backWall);

            // Start Wall (Behind player)
            const startWall = new THREE.Mesh(backWallGeo, backWallMat);
            startWall.rotation.y = Math.PI;
            startWall.position.z = 40;
            startWall.position.y = roomHeight / 2;
            scene.add(startWall);

            // Ceiling Lamps
            for (let z = 20; z > -totalZ + 40; z -= zSpacing) {
                const lampGeo = new THREE.CylinderGeometry(0.8, 1, 0.4, 16);
                const lampMat = new THREE.MeshStandardMaterial({ color: 0x333333, emissive: 0xffffff, emissiveIntensity: 1 });
                const lamp = new THREE.Mesh(lampGeo, lampMat);
                lamp.position.set(0, roomHeight - 0.2, z);
                scene.add(lamp);
                
                const pointLight = new THREE.PointLight(0xffffee, 0.5, 60);
                pointLight.position.set(0, roomHeight - 1, z);
                scene.add(pointLight);
            }

            // Add Photos and Wall Lamps
            const textureLoader = new THREE.TextureLoader();
            const gltfLoader = new GLTFLoader();

            function renderPhotos(lampModel) {
                photosData.forEach((photo, index) => {
                    const side = index % 2 === 0 ? 'left' : 'right';
                const zPos = -Math.floor(index / 2) * zSpacing;
                
                textureLoader.load(photo.image_url, function(texture) {
                    texture.colorSpace = THREE.SRGBColorSpace;
                    texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
                    texture.minFilter = THREE.LinearMipmapLinearFilter;
                    texture.magFilter = THREE.LinearFilter;
                    texture.generateMipmaps = true;
                    
                    const aspect = texture.image.width / texture.image.height;
                    let pHeight = 10;
                    let pWidth = pHeight * aspect;
                    
                    if (pWidth > 18) {
                        pWidth = 18;
                        pHeight = pWidth / aspect;
                    }
                    
                    // Image Plane
                    const imgGeo = new THREE.PlaneGeometry(pWidth, pHeight);
                    const imgMat = new THREE.MeshBasicMaterial({ map: texture });
                    const imgMesh = new THREE.Mesh(imgGeo, imgMat);
                    
                    // Frame
                    const frameGeo = new THREE.BoxGeometry(pWidth + 0.8, pHeight + 0.8, 0.4);
                    const frameMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.2 }); // Siyah çerçeve güzel durur
                    const frameMesh = new THREE.Mesh(frameGeo, frameMat);
                    
                    if (side === 'left') {
                        // Frame center at -19.9, front face is at -19.7
                        // Place image at -19.65 to be slightly in front of the frame face
                        imgMesh.position.set(-roomWidth / 2 + 0.35, roomHeight / 2, zPos);
                        imgMesh.rotation.y = Math.PI / 2;
                        
                        frameMesh.position.set(-roomWidth / 2 + 0.1, roomHeight / 2, zPos);
                        frameMesh.rotation.y = Math.PI / 2;
                    } else {
                        // Frame center at 19.9, front face is at 19.7
                        // Place image at 19.65 to be slightly in front of the frame face
                        imgMesh.position.set(roomWidth / 2 - 0.35, roomHeight / 2, zPos);
                        imgMesh.rotation.y = -Math.PI / 2;
                        
                        frameMesh.position.set(roomWidth / 2 - 0.1, roomHeight / 2, zPos);
                        frameMesh.rotation.y = -Math.PI / 2;
                    }
                    
                    scene.add(imgMesh);
                    scene.add(frameMesh);
                    
                    // Create Plaque
                    const plaqueTex = createTextTexture(photo);
                    plaqueTex.anisotropy = renderer.capabilities.getMaxAnisotropy();
                    
                    const plaqueGeo = new THREE.PlaneGeometry(3, 3);
                    const plaqueMat = new THREE.MeshBasicMaterial({ map: plaqueTex });
                    const plaqueMesh = new THREE.Mesh(plaqueGeo, plaqueMat);
                    
                    const plaqueFrameGeo = new THREE.BoxGeometry(3.2, 3.2, 0.2);
                    const plaqueFrameMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.3 });
                    const plaqueFrameMesh = new THREE.Mesh(plaqueFrameGeo, plaqueFrameMat);
                    
                    if (side === 'left') {
                        plaqueMesh.position.set(-roomWidth / 2 + 0.35, roomHeight / 2 - 2, zPos - pWidth / 2 - 2.5);
                        plaqueMesh.rotation.y = Math.PI / 2;
                        
                        plaqueFrameMesh.position.set(-roomWidth / 2 + 0.15, roomHeight / 2 - 2, zPos - pWidth / 2 - 2.5);
                        plaqueFrameMesh.rotation.y = Math.PI / 2;
                    } else {
                        plaqueMesh.position.set(roomWidth / 2 - 0.35, roomHeight / 2 - 2, zPos - pWidth / 2 - 2.5);
                        plaqueMesh.rotation.y = -Math.PI / 2;
                        
                        plaqueFrameMesh.position.set(roomWidth / 2 - 0.15, roomHeight / 2 - 2, zPos - pWidth / 2 - 2.5);
                        plaqueFrameMesh.rotation.y = -Math.PI / 2;
                    }
                    scene.add(plaqueMesh);
                    scene.add(plaqueFrameMesh);
                    
                    // Spotlight above the painting
                    const spotLight = new THREE.SpotLight(0xffffff, 2.5);
                    spotLight.position.set(side === 'left' ? -roomWidth/2 + 6 : roomWidth/2 - 6, roomHeight - 1, zPos);
                    spotLight.target = imgMesh;
                    spotLight.angle = Math.PI / 5;
                    spotLight.penumbra = 0.5;
                    spotLight.distance = 30;
                    spotLight.decay = 1.5;
                    scene.add(spotLight);
                    
                    // Wall Lamps (Left and Right of the painting)
                    if (lampModel) {
                        const lampLeft = lampModel.clone();
                        const lampRight = lampModel.clone();
                        
                        const lampScale = 0.045; // Increased by 1.5x from 0.03
                        lampLeft.scale.set(lampScale, lampScale, lampScale);
                        lampRight.scale.set(lampScale, lampScale, lampScale);
                        
                        const lampOffset = pWidth / 2 + 2.0; // Closer to the painting
                        const lampHeight = roomHeight / 2 + 2.5; // Slightly above the middle
                        
                        if (side === 'left') {
                            lampLeft.position.set(-roomWidth / 2 + 0.5, lampHeight, zPos + lampOffset);
                            lampLeft.rotation.y = -Math.PI / 2; // Rotated 180 deg
                            
                            lampRight.position.set(-roomWidth / 2 + 0.5, lampHeight, zPos - lampOffset);
                            lampRight.rotation.y = -Math.PI / 2; // Rotated 180 deg
                        } else {
                            lampLeft.position.set(roomWidth / 2 - 0.5, lampHeight, zPos + lampOffset);
                            lampLeft.rotation.y = Math.PI / 2; // Rotated 180 deg
                            
                            lampRight.position.set(roomWidth / 2 - 0.5, lampHeight, zPos - lampOffset);
                            lampRight.rotation.y = Math.PI / 2; // Rotated 180 deg
                        }
                        
                        scene.add(lampLeft);
                        scene.add(lampRight);
                        
                        // Add warm light for each lamp
                        const lightLeft = new THREE.PointLight(0xffddaa, 0.5, 15);
                        lightLeft.position.copy(lampLeft.position);
                        scene.add(lightLeft);
                        
                        const lightRight = new THREE.PointLight(0xffddaa, 0.5, 15);
                        lightRight.position.copy(lampRight.position);
                        scene.add(lightRight);
                    }
                });
            });
        }

        gltfLoader.load('{{ url_for("static", filename="models/wall_lamp.glb") }}', function(gltf) {
                renderPhotos(gltf.scene);
            }, undefined, function(error) {
                console.error("Failed to load wall lamp:", error);
                renderPhotos(null);
            });

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            document.body.appendChild(renderer.domElement);

            window.addEventListener('resize', onWindowResize);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();
            const delta = (time - prevTime) / 1000;

            if (!isMobile && controls && controls.isLocked === true) {
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;

                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();

                const speed = 100.0;
                if (moveForward || moveBackward) velocity.z -= direction.z * speed * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * speed * delta;

                const pos = controls.getObject().position;
                const oldX = pos.x;
                const oldZ = pos.z;

                controls.moveRight(-velocity.x * delta);
                controls.moveForward(-velocity.z * delta);
                
                // Wall Collision
                if (pos.x < -roomWidth / 2 + 2) pos.x = -roomWidth / 2 + 2;
                if (pos.x > roomWidth / 2 - 2) pos.x = roomWidth / 2 - 2;
                if (pos.z > 40 - 2) pos.z = 40 - 2; 
                if (pos.z < -totalZ + 40 + 2) pos.z = -totalZ + 40 + 2; 
                
                // Obstacle Collision
                for (let i = 0; i < obstacles.length; i++) {
                    const obs = obstacles[i];
                    if (Math.abs(pos.x - obs.x) < (obs.width / 2 + 1.5) && 
                        Math.abs(pos.z - obs.z) < (obs.depth / 2 + 1.5)) {
                        pos.x = oldX;
                        pos.z = oldZ;
                        break;
                    }
                }
                
                pos.y = 8;
            } else if (isMobile) {
                // Mobile Look
                phi = THREE.MathUtils.degToRad(90 - lat);
                theta = THREE.MathUtils.degToRad(lon);
                const targetPosition = new THREE.Vector3();
                targetPosition.x = camera.position.x + 100 * Math.sin(phi) * Math.cos(theta);
                targetPosition.y = camera.position.y + 100 * Math.cos(phi);
                targetPosition.z = camera.position.z + 100 * Math.sin(phi) * Math.sin(theta);
                camera.lookAt(targetPosition);

                // Mobile Move
                const speed = 30.0;
                
                const forwardVec = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
                forwardVec.y = 0; forwardVec.normalize();
                
                const rightVec = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
                rightVec.y = 0; rightVec.normalize();

                const pos = camera.position;
                const oldX = pos.x;
                const oldZ = pos.z;

                if (fwdValue > 0) camera.position.addScaledVector(forwardVec, speed * delta * fwdValue);
                if (bkdValue > 0) camera.position.addScaledVector(forwardVec, -speed * delta * bkdValue);
                if (rgtValue > 0) camera.position.addScaledVector(rightVec, speed * delta * rgtValue);
                if (lftValue > 0) camera.position.addScaledVector(rightVec, -speed * delta * lftValue);

                // Wall Collision
                if (pos.x < -roomWidth / 2 + 2) pos.x = -roomWidth / 2 + 2;
                if (pos.x > roomWidth / 2 - 2) pos.x = roomWidth / 2 - 2;
                if (pos.z > 40 - 2) pos.z = 40 - 2; 
                if (pos.z < -totalZ + 40 + 2) pos.z = -totalZ + 40 + 2; 
                
                // Obstacle Collision
                for (let i = 0; i < obstacles.length; i++) {
                    const obs = obstacles[i];
                    if (Math.abs(pos.x - obs.x) < (obs.width / 2 + 1.5) && 
                        Math.abs(pos.z - obs.z) < (obs.depth / 2 + 1.5)) {
                        pos.x = oldX;
                        pos.z = oldZ;
                        break;
                    }
                }
                
                pos.y = 8;
            }

            prevTime = time;

            // --- Avatar Update Logic ---
            if (avatarGroup) {
                const camPos = isMobile ? camera.position : controls.getObject().position;
                
                // Match position (except Y is locked to 0)
                avatarGroup.position.set(camPos.x, 0, camPos.z);
                
                // Match rotation Y (Yaw)
                const euler = new THREE.Euler(0, 0, 0, 'YXZ');
                if (isMobile) {
                    euler.setFromQuaternion(camera.quaternion);
                } else {
                    euler.setFromQuaternion(controls.getObject().quaternion);
                }
                
                // Since the camera looks "forward", we rotate the avatar 180 degrees so its back faces the camera (like a standard third-person game)
                avatarGroup.rotation.y = euler.y + Math.PI;

                // Update GLTF Animations
                if (avatarMixer) {
                    avatarMixer.update(delta);
                }
            }

            let activeCamera = isThirdPerson ? tpCamera : camera;
            if (isThirdPerson) {
                const dist = 12;
                const dir = new THREE.Vector3(0, 0, 1);
                dir.applyAxisAngle(new THREE.Vector3(0,1,0), avatarGroup.rotation.y);
                tpCamera.position.copy(camera.position).add(dir.multiplyScalar(dist));
                tpCamera.position.y = camera.position.y + 4;
                
                // Duvarların dışına çıkmasını engelle (Kamera sınırlandırma)
                const marginX = 1.5; // Duvardan ne kadar uzak kalacağı
                const marginZ = 1.5;
                tpCamera.position.x = Math.max(-roomWidth / 2 + marginX, Math.min(roomWidth / 2 - marginX, tpCamera.position.x));
                tpCamera.position.z = Math.max(-totalZ + 40 + marginZ, Math.min(40 - marginZ, tpCamera.position.z));
                
                tpCamera.lookAt(camera.position);
            }

            renderer.render(scene, activeCamera);
        }
        
        document.getElementById('cam-toggle-btn').addEventListener('click', () => {
            isThirdPerson = !isThirdPerson;
        });
    </script>
</body>
</html>
