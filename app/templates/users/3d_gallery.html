<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{{ user.username }} - 3D Sanat Galerisi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #0b0e14; 
            font-family: 'Plus Jakarta Sans', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        #blocker {
            position: absolute; width: 100%; height: 100%;
            background: radial-gradient(circle at center, rgba(15, 23, 42, 0.85) 0%, rgba(3, 7, 18, 0.95) 100%);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            color: white; text-align: center;
            z-index: 50;
            backdrop-filter: blur(12px);
            transition: opacity 0.4s ease;
        }
        #instructions {
            cursor: pointer;
            padding: 36px 48px; 
            border: 1px solid rgba(255,255,255,0.12); 
            border-radius: 24px;
            background: rgba(255,255,255,0.04);
            display: inline-block; 
            margin: 0 auto;
            backdrop-filter: blur(20px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.05);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            max-width: 90vw;
        }
        #instructions:hover {
            background: rgba(255,255,255,0.08);
            border-color: rgba(255,255,255,0.25);
            transform: translateY(-2px) scale(1.01);
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.6);
        }
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            width: 6px; height: 6px;
            background-color: rgba(255,255,255,0.9);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 5;
            display: none;
            box-shadow: 0 0 8px rgba(0,0,0,0.8);
        }
        .hud-btn {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.36);
            transition: all 0.2s ease;
        }
        .hud-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.25);
            transform: translateY(-1px);
        }
        #room-badge {
            transition: all 0.4s ease;
        }
    </style>
</head>
<body>
    <!-- Top HUD Navigation -->
    <div class="fixed top-5 left-5 z-40 flex items-center gap-3">
        <button id="back-btn" onclick="if(document.referrer) { history.back(); } else { window.location.href='{{ url_for('users.profile', username=user.username) }}'; }" class="hud-btn px-4 py-2.5 text-white rounded-xl font-semibold text-xs tracking-wider uppercase flex items-center gap-2 cursor-pointer">
            <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            <span>Profile Dön</span>
        </button>
    </div>

    <!-- Active Wing / Room Indicator -->
    <div id="room-badge" class="fixed top-5 left-1/2 -translate-x-1/2 z-40 hud-btn px-5 py-2 rounded-full text-white/90 text-xs font-semibold tracking-widest uppercase flex items-center gap-2 pointer-events-none">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        <span id="room-name">Sanat Galerisi 1</span>
    </div>

    <!-- Camera Mode Toggle -->
    <div class="fixed top-5 right-5 z-40 flex items-center gap-3">
        <button id="cam-toggle-btn" class="hud-btn px-4 py-2.5 text-white rounded-xl font-semibold text-xs tracking-wider uppercase flex items-center gap-2 cursor-pointer" title="Bakış Açısını Değiştir (C)">
            <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
            <span id="cam-mode-text" class="hidden sm:inline">Kamera: 3. Şahıs (C)</span>
        </button>
    </div>

    <!-- Entrance Blocker / Instructions -->
    <div id="blocker">
        <div id="instructions">
            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-xs font-semibold tracking-widest uppercase mb-4">
                Rotary Art Gallery
            </div>
            <h1 class="text-3xl md:text-4xl font-extrabold text-white tracking-tight mb-2">
                {{ user.username }} <span class="text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-400">3D Sanat Galerisi</span>
            </h1>
            <p class="text-gray-400 text-sm max-w-md mx-auto mb-6">
                Özel sergi duvarları, arkalı önlü sergilenen yüksek çözünürlüklü eserler ve bağlantılı galeri salonları.
            </p>
            
            <div class="inline-block px-6 py-3 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-500 text-white font-bold text-sm tracking-wider uppercase shadow-lg shadow-emerald-500/20 mb-8 cursor-pointer transform hover:scale-105 transition-all">
                Galeriye Adım At
            </div>

            <div class="grid grid-cols-2 gap-x-10 gap-y-3 text-left text-xs text-gray-300 font-medium border-t border-white/10 pt-6 max-w-sm mx-auto">
                <div class="flex items-center gap-2">
                    <span class="px-2 py-1 rounded bg-white/10 text-white font-mono font-bold">W A S D</span>
                    <span>Yürüme</span>
                </div>
                <div class="flex items-center gap-2">
                    <span class="px-2 py-1 rounded bg-white/10 text-white font-mono font-bold">Mouse</span>
                    <span>Etrafı İncele</span>
                </div>
                <div class="flex items-center gap-2">
                    <span class="px-2 py-1 rounded bg-white/10 text-white font-mono font-bold">C</span>
                    <span>Bakış Açısı</span>
                </div>
                <div class="flex items-center gap-2">
                    <span class="px-2 py-1 rounded bg-white/10 text-white font-mono font-bold">ESC</span>
                    <span>İmleci Bırak</span>
                </div>
            </div>
        </div>
    </div>
    
    <div id="crosshair"></div>
    <div id="error-box" style="position:fixed; top:80px; left:20px; z-index:9999; background:rgba(220,38,38,0.9); color:white; padding:12px 18px; border-radius:12px; font-family:monospace; display:none; max-width: 80%; font-size:12px;"></div>

    <script>
    window.addEventListener('error', function(e) {
        const eb = document.getElementById('error-box');
        if (eb) {
            eb.style.display = 'block';
            eb.innerHTML += "Hata: " + e.message + " (" + e.filename + ":" + e.lineno + ")<br>";
        }
    });
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>
    <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || navigator.maxTouchPoints > 0;
        const photosData = {{ photos_json | safe }};

        // Core Three.js variables
        let camera, tpCamera, scene, renderer, controls;
        let isThirdPerson = true;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let prevTime = performance.now();
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();

        // Mobile control variables
        let fwdValue = 0, bkdValue = 0, rgtValue = 0, lftValue = 0;
        let previousTouchLook = { x: 0, y: 0 };
        let lon = -90, lat = 0;
        let phi = 0, theta = 0;

        // Avatar variables
        let avatarGroup;
        let avatarMixer;
        let currentAction;
        let walkAction;
        let idleAction;

        // Walkable Zones and Obstacles for collision detection
        const walkableZones = [];
        const obstacles = [];
        const zoneLabels = [];

        // Architecture: 12 photos per gallery module (6 walls × 2 sides)
        const PHOTOS_PER_MODULE = 12;
        const MODULE_Z_SPACING = 52.89; // Exact room depth to align back wall with next entrance

        init();
        animate();

        // --- EXIF Info Plaque Texture ---
        function createPlaqueTexture(photo) {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 680;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.lineWidth = 8;
            ctx.strokeRect(8, 8, canvas.width - 16, canvas.height - 16);

            ctx.fillStyle = '#10b981';
            ctx.fillRect(40, 40, 12, 100);

            // Title
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 56px sans-serif';
            ctx.textAlign = 'left';
            const title = (photo.title || 'İsimsiz Eser').substring(0, 30);
            ctx.fillText(title, 70, 105);

            // Description (word wrap)
            ctx.fillStyle = '#94a3b8';
            ctx.font = '36px sans-serif';
            const desc = photo.description || 'ShutterGallery sergi koleksiyonundan bir kare.';
            const words = desc.split(' ');
            let line = '';
            let y = 200;
            for (let n = 0; n < words.length; n++) {
                let testLine = line + words[n] + ' ';
                let metrics = ctx.measureText(testLine);
                if (metrics.width > canvas.width - 120 && n > 0) {
                    ctx.fillText(line, 50, y);
                    line = words[n] + ' ';
                    y += 48;
                    if (y > 350) break;
                } else {
                    line = testLine;
                }
            }
            ctx.fillText(line, 50, y);

            // Divider Line
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(50, 420);
            ctx.lineTo(canvas.width - 50, 420);
            ctx.stroke();

            // EXIF Camera Information
            ctx.font = 'bold 30px monospace';
            ctx.fillStyle = '#38bdf8';
            ctx.fillText('EXIF METRİKLERİ', 50, 470);

            ctx.font = '28px monospace';
            ctx.fillStyle = '#cbd5e1';
            let exif1 = [];
            if (photo.camera_model) exif1.push(`Kamera: ${photo.camera_model}`);
            if (photo.lens_model) exif1.push(`Lens: ${photo.lens_model}`);
            ctx.fillText(exif1.join('  |  ') || 'Kamera bilgisi girilmedi', 50, 525);

            let exif2 = [];
            if (photo.iso) exif2.push(`ISO ${photo.iso}`);
            if (photo.aperture) exif2.push(`f/${photo.aperture}`);
            if (photo.shutter_speed) exif2.push(`${photo.shutter_speed}s`);
            ctx.fillText(exif2.join('   •   ') || 'Pozlama ayarları saklı', 50, 575);

            const texture = new THREE.CanvasTexture(canvas);
            return texture;
        }

        // --- Doorway Sign Texture ---
        function createDoorSignTexture(nextIndex) {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = '#10b981';
            ctx.lineWidth = 6;
            ctx.strokeRect(6, 6, canvas.width - 12, canvas.height - 12);

            ctx.fillStyle = '#10b981';
            ctx.font = 'bold 44px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(`SALON ${nextIndex} ➔`, canvas.width / 2, 80);

            return new THREE.CanvasTexture(canvas);
        }

        // --- Main Init Function ---
        function init() {
            // Human-height perspective inside real-scale gallery
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.7, 24); // Spawns near front entrance looking down gallery aisle

            tpCamera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111827); // Dark museum exterior backdrop

            // Museum Ambient & Directional Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xfffaf0, 0.7);
            sunLight.position.set(20, 40, 20);
            scene.add(sunLight);

            // Load the downloaded art_gallery.glb Model
            const gltfLoader = new GLTFLoader();
            gltfLoader.load('{{ url_for("static", filename="models/art_gallery.glb") }}', function(gltf) {
                const baseGalleryScene = gltf.scene;

                // Materials for Frames, Paspartu, and Doors
                const frameMat = new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.3, metalness: 0.8 });
                const paspartuMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.95 });
                const wallPatchMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.85 });

                const numModules = Math.max(1, Math.ceil(photosData.length / PHOTOS_PER_MODULE));

                for (let m = 0; m < numModules; m++) {
                    const moduleOffsetZ = -m * MODULE_Z_SPACING;
                    const hasNext = (m < numModules - 1);
                    const modulePhotos = photosData.slice(m * PHOTOS_PER_MODULE, (m + 1) * PHOTOS_PER_MODULE);

                    buildGalleryModule({
                        scene,
                        baseModel: baseGalleryScene,
                        frameMat,
                        paspartuMat,
                        wallPatchMat,
                        moduleIndex: m + 1,
                        moduleOffsetZ,
                        photos: modulePhotos,
                        hasNext
                    });
                }
            }, undefined, function(error) {
                console.error("Art gallery model failed to load:", error);
            });

            // Load Avatar
            loadAvatar();

            // Setup Controls
            setupControls();

            // Renderer Setup
            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            const maxPixelRatio = isMobile ? 1.0 : Math.min(window.devicePixelRatio, 2.0);
            renderer.setPixelRatio(maxPixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.1;
            document.body.appendChild(renderer.domElement);

            window.addEventListener('resize', onWindowResize);
        }

        // --- Build a Single Gallery Module with 6 Walls (12 Photo Slots) ---
        function buildGalleryModule({ scene, baseModel, frameMat, paspartuMat, wallPatchMat, moduleIndex, moduleOffsetZ, photos, hasNext }) {
            const galleryInstance = baseModel.clone(true);
            galleryInstance.position.set(0, 0, moduleOffsetZ);

            // Remove triangles as needed for this module:
            //   - moduleIndex > 1 (secondary module): remove front entrance door tris 0-1 (indices 0..5, Z = +33.96)
            //   - hasNext: remove back wall tris 2-4 (indices 6..14, Z = -18.93) to open passageway
            const needsEntranceOpen = (moduleIndex > 1);
            if (hasNext || needsEntranceOpen) {
                galleryInstance.traverse(function(child) {
                    if (child.isMesh && child.name.includes('Cube_pbr.001')) {
                        const geo = child.geometry.clone();
                        if (geo.index) {
                            const arr = geo.index.array;
                            const newIndices = [];
                            for (let j = 0; j < arr.length; j += 3) {
                                // Skip front entrance door (indices 0..5) for secondary modules
                                if (needsEntranceOpen && j >= 0 && j <= 5) continue;
                                // Skip back wall (indices 6..14) when connecting to next gallery
                                if (hasNext && j >= 6 && j <= 14) continue;
                                newIndices.push(arr[j], arr[j+1], arr[j+2]);
                            }
                            geo.setIndex(newIndices);
                            child.geometry = geo;
                        }
                    }
                });
            }

            if (hasNext) {
                // Double-sided wall patch material so it looks correct from both galleries
                const patchMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.85, side: THREE.DoubleSide });

                // Add left and right wall filler panels around the center doorway at Z = -18.93
                // Left filler: X in [-21.9, -3.67], Y in [0, 7.0]
                const leftPatchW = 21.9 - 3.67;
                const leftPatch = new THREE.Mesh(new THREE.PlaneGeometry(leftPatchW, 7.0), patchMat);
                leftPatch.position.set(-21.9 + leftPatchW / 2, 3.5, -18.93 + moduleOffsetZ);
                scene.add(leftPatch);

                // Right filler: X in [3.67, 21.9], Y in [0, 7.0]
                const rightPatch = new THREE.Mesh(new THREE.PlaneGeometry(leftPatchW, 7.0), patchMat);
                rightPatch.position.set(21.9 - leftPatchW / 2, 3.5, -18.93 + moduleOffsetZ);
                scene.add(rightPatch);

                // Header filler above doorway: X in [-3.67, 3.67], Y in [4.8, 7.0]
                const headerH = 2.2;
                const headerPatch = new THREE.Mesh(new THREE.PlaneGeometry(7.34, headerH), patchMat);
                headerPatch.position.set(0, 4.8 + headerH / 2, -18.93 + moduleOffsetZ);
                scene.add(headerPatch);

                // Doorway Frame: hollow posts (left + right) + top lintel, center is OPEN
                const postH = 4.8;
                const postW = 0.35;
                const postD = 0.4;
                // Left post
                const leftPost = new THREE.Mesh(new THREE.BoxGeometry(postW, postH, postD), frameMat);
                leftPost.position.set(-3.84, postH / 2, -18.93 + moduleOffsetZ);
                scene.add(leftPost);
                // Right post
                const rightPost = new THREE.Mesh(new THREE.BoxGeometry(postW, postH, postD), frameMat);
                rightPost.position.set(3.84, postH / 2, -18.93 + moduleOffsetZ);
                scene.add(rightPost);
                // Top lintel
                const lintel = new THREE.Mesh(new THREE.BoxGeometry(7.8 + postW * 2, 0.35, postD), frameMat);
                lintel.position.set(0, postH + 0.175, -18.93 + moduleOffsetZ);
                scene.add(lintel);

                // Sign above door
                const signTex = createDoorSignTexture(moduleIndex + 1);
                const signGeo = new THREE.PlaneGeometry(4.0, 0.9);
                const signMesh = new THREE.Mesh(signGeo, new THREE.MeshBasicMaterial({ map: signTex }));
                signMesh.position.set(0, 5.6, -18.7 + moduleOffsetZ);
                scene.add(signMesh);
            }

            scene.add(galleryInstance);

            // --- 6 Interior Exhibition Walls (12 Photo Slots) ---
            // Wall definitions (Center X, Center Z in local space)
            // Left row: X = -10, Right row: X = +10. Z positions: +10, 0, -10.
            const wallDefs = [
                { name: 'Sol Ön Duvar',   wx: -10.0, wz: 10.0 },
                { name: 'Sağ Ön Duvar',   wx: 10.0,  wz: 10.0 },
                { name: 'Sol Orta Duvar', wx: -10.0, wz: 0.0 },
                { name: 'Sağ Orta Duvar', wx: 10.0,  wz: 0.0 },
                { name: 'Sol Arka Duvar', wx: -10.0, wz: -10.0 },
                { name: 'Sağ Arka Duvar', wx: 10.0,  wz: -10.0 },
            ];

            // 12 Slots: Front (+Z) and Back (-Z) for each of the 6 walls
            const slots = [];
            wallDefs.forEach((w) => {
                // Front Face (Facing +Z towards entrance)
                slots.push({
                    name: `${w.name} (Ön Yüz)`,
                    x: w.wx,
                    y: 2.0,
                    z: w.wz + 0.16 + moduleOffsetZ,
                    rotY: 0.0,
                    normalZ: 1.0
                });
                // Back Face (Facing -Z towards back wall)
                slots.push({
                    name: `${w.name} (Arka Yüz)`,
                    x: w.wx,
                    y: 2.0,
                    z: w.wz - 0.16 + moduleOffsetZ,
                    rotY: Math.PI,
                    normalZ: -1.0
                });
            });

            // Mount Photos onto the Slots
            const textureLoader = new THREE.TextureLoader();
            textureLoader.setCrossOrigin('anonymous');

            photos.forEach((photo, idx) => {
                if (idx >= slots.length) return;
                const slot = slots[idx];

                textureLoader.load(photo.image_url, function(texture) {
                    texture.colorSpace = THREE.SRGBColorSpace;
                    texture.anisotropy = Math.min(renderer.capabilities.getMaxAnisotropy(), 8);
                    texture.minFilter = THREE.LinearMipmapLinearFilter;
                    texture.magFilter = THREE.LinearFilter;
                    texture.generateMipmaps = true;

                    const aspect = (texture.image && texture.image.height > 0) ? (texture.image.width / texture.image.height) : 1.33;
                    let photoH = 1.8;
                    let photoW = photoH * aspect;
                    if (photoW > 3.4) {
                        photoW = 3.4;
                        photoH = photoW / aspect;
                    }

                    // Dimensions
                    const matPadding = 0.18;
                    const matW = photoW + matPadding * 2;
                    const matH = photoH + matPadding * 2;

                    // 1. Dark Outer Frame Box
                    const frameThickness = 0.06;
                    const outerFrameMesh = new THREE.Mesh(
                        new THREE.BoxGeometry(matW + 0.12, matH + 0.12, frameThickness),
                        frameMat
                    );
                    outerFrameMesh.position.set(slot.x, slot.y, slot.z + slot.normalZ * (frameThickness / 2));
                    outerFrameMesh.rotation.y = slot.rotY;
                    scene.add(outerFrameMesh);

                    // 2. White Paspartu Plane (sitting on face of frame)
                    const matMesh = new THREE.Mesh(
                        new THREE.PlaneGeometry(matW, matH),
                        paspartuMat
                    );
                    matMesh.position.set(slot.x, slot.y, slot.z + slot.normalZ * (frameThickness + 0.005));
                    matMesh.rotation.y = slot.rotY;
                    scene.add(matMesh);

                    // 3. The Photograph Plane (clearly positioned in front of paspartu)
                    const photoMat = new THREE.MeshBasicMaterial({ 
                        map: texture, 
                        side: THREE.FrontSide,
                        toneMapped: false 
                    });
                    const photoMesh = new THREE.Mesh(
                        new THREE.PlaneGeometry(photoW, photoH), 
                        photoMat
                    );
                    photoMesh.position.set(slot.x, slot.y, slot.z + slot.normalZ * (frameThickness + 0.012));
                    photoMesh.rotation.y = slot.rotY;
                    scene.add(photoMesh);

                    // EXIF Plaque on the wall beside painting
                    const plaqueTex = createPlaqueTexture(photo);
                    const plaqueW = 1.0;
                    const plaqueH = 0.65;
                    const plaqueMesh = new THREE.Mesh(new THREE.PlaneGeometry(plaqueW, plaqueH), new THREE.MeshBasicMaterial({ map: plaqueTex, toneMapped: false }));
                    const plaqueBack = new THREE.Mesh(new THREE.BoxGeometry(plaqueW + 0.06, plaqueH + 0.06, 0.04), frameMat);

                    const plaqueSide = (slot.normalZ > 0) ? 1.0 : -1.0;
                    const plaqueX = slot.x + plaqueSide * (photoW / 2 + 0.85);

                    plaqueBack.position.set(plaqueX, slot.y - 0.2, slot.z + slot.normalZ * 0.02);
                    plaqueBack.rotation.y = slot.rotY;
                    scene.add(plaqueBack);

                    plaqueMesh.position.set(plaqueX, slot.y - 0.2, slot.z + slot.normalZ * 0.045);
                    plaqueMesh.rotation.y = slot.rotY;
                    scene.add(plaqueMesh);

                    // Warm Gallery Spotlight from ceiling
                    const spot = new THREE.SpotLight(0xfff8ee, 3.5, 12, Math.PI / 4, 0.4);
                    spot.decay = 1.2;
                    spot.position.set(slot.x, 5.5, slot.z + slot.normalZ * 2.2);
                    spot.target = photoMesh;
                    scene.add(spot);
                    scene.add(spot.target);
                }, undefined, function(err) {
                    console.error("Fotoğraf yüklenemedi:", photo.image_url, err);
                });
            });

            // --- Collision Boundaries for this Gallery Module ---
            // Main Room Walkable Zone (covers full room floor including up to walls)
            walkableZones.push({
                minX: -21.5,
                maxX: 21.5,
                minZ: -18.8 + moduleOffsetZ,
                maxZ: 28.3 + moduleOffsetZ
            });

            // Entrance Vestibule Walkable Zone
            walkableZones.push({
                minX: -3.4,
                maxX: 3.4,
                minZ: 27.5 + moduleOffsetZ,
                maxZ: 33.7 + moduleOffsetZ
            });

            // Doorway to next gallery (if applicable) - overlap zones to eliminate gap
            if (hasNext) {
                walkableZones.push({
                    minX: -3.4,
                    maxX: 3.4,
                    minZ: -20.0 + moduleOffsetZ,
                    maxZ: -17.5 + moduleOffsetZ
                });
            }

            // Register the 6 interior walls as collision obstacles
            // Physical wall thickness is 0.24m (±0.12), use ±0.15 buffer so player stops just at the face
            wallDefs.forEach((w) => {
                obstacles.push({
                    minX: w.wx - 4.0,
                    maxX: w.wx + 4.0,
                    minZ: w.wz - 0.15 + moduleOffsetZ,
                    maxZ: w.wz + 0.15 + moduleOffsetZ
                });
            });

            zoneLabels.push({
                name: `Sanat Galerisi ${moduleIndex}`,
                minZ: -18.93 + moduleOffsetZ,
                maxZ: 33.96 + moduleOffsetZ
            });
        }

        // --- Collision Checkers ---
        function isPositionWalkable(x, z, radius = 0.5) {
            let inWalkableZone = false;
            for (let i = 0; i < walkableZones.length; i++) {
                const zBox = walkableZones[i];
                if (x >= zBox.minX + radius && x <= zBox.maxX - radius &&
                    z >= zBox.minZ + radius && z <= zBox.maxZ - radius) {
                    inWalkableZone = true;
                    break;
                }
            }
            if (!inWalkableZone) return false;

            // Check against interior walls
            for (let i = 0; i < obstacles.length; i++) {
                const obs = obstacles[i];
                if (x >= obs.minX - radius && x <= obs.maxX + radius &&
                    z >= obs.minZ - radius && z <= obs.maxZ + radius) {
                    return false;
                }
            }
            return true;
        }

        function updateRoomIndicator(currentZ) {
            const badge = document.getElementById('room-name');
            if (!badge) return;
            for (let i = 0; i < zoneLabels.length; i++) {
                const z = zoneLabels[i];
                if (currentZ >= z.minZ && currentZ <= z.maxZ) {
                    if (badge.textContent !== z.name) {
                        badge.textContent = z.name;
                    }
                    return;
                }
            }
        }

        // --- Avatar Loader & Animation System ---
        function loadAvatar() {
            avatarGroup = new THREE.Group();
            scene.add(avatarGroup);

            const loader = new GLTFLoader();
            loader.load('{{ url_for("static", filename="models/lowpoly_anime_character_cyberstyle.glb") }}', function (gltf) {
                const model = gltf.scene;

                // Native human scale (1.0 = 1.80m tall) perfectly fits this gallery model
                model.scale.set(1.0, 1.0, 1.0);
                model.position.set(0, 0, 0);

                model.traverse(function (node) {
                    if (node.isMesh) {
                        node.castShadow = true;
                        node.receiveShadow = true;
                        if (node.material) {
                            node.material.roughness = 0.6;
                        }
                    }
                });

                avatarGroup.add(model);

                // GLTF Animations (Idle and Walk)
                if (gltf.animations && gltf.animations.length > 0) {
                    avatarMixer = new THREE.AnimationMixer(model);

                    for (let i = 0; i < gltf.animations.length; i++) {
                        const clip = gltf.animations[i];
                        const name = clip.name.toLowerCase();

                        if (name.includes('walk') || name.includes('run')) {
                            walkAction = avatarMixer.clipAction(clip);
                        } else if (name.includes('idle') || name.includes('stand') || name.includes('breath') || name.includes('wait')) {
                            idleAction = avatarMixer.clipAction(clip);
                        }
                    }

                    if (!walkAction && gltf.animations.length > 0) walkAction = avatarMixer.clipAction(gltf.animations[0]);
                    if (!idleAction && gltf.animations.length > 1) idleAction = avatarMixer.clipAction(gltf.animations[1]);
                    if (!idleAction && walkAction) idleAction = walkAction;

                    if (idleAction) {
                        currentAction = idleAction;
                        currentAction.play();
                    }
                }
            }, undefined, function (error) {
                console.error("Avatar failed to load:", error);
            });
        }

        // --- PC & Mobile Controls Setup ---
        function setupControls() {
            if (!isMobile) {
                controls = new PointerLockControls(camera, document.body);

                const blocker = document.getElementById('blocker');
                const instructions = document.getElementById('instructions');
                const crosshair = document.getElementById('crosshair');

                instructions.addEventListener('click', function () {
                    controls.lock();
                });

                controls.addEventListener('lock', function () {
                    instructions.style.display = 'none';
                    blocker.style.display = 'none';
                    crosshair.style.display = 'block';
                });

                controls.addEventListener('unlock', function () {
                    blocker.style.display = 'flex';
                    instructions.style.display = '';
                    crosshair.style.display = 'none';
                });

                scene.add(controls.getObject());

                const onKeyDown = function (event) {
                    switch (event.code) {
                        case 'ArrowUp': case 'KeyW': moveForward = true; break;
                        case 'ArrowLeft': case 'KeyA': moveLeft = true; break;
                        case 'ArrowDown': case 'KeyS': moveBackward = true; break;
                        case 'ArrowRight': case 'KeyD': moveRight = true; break;
                        case 'KeyC': toggleCameraView(); break;
                    }
                };

                const onKeyUp = function (event) {
                    switch (event.code) {
                        case 'ArrowUp': case 'KeyW': moveForward = false; break;
                        case 'ArrowLeft': case 'KeyA': moveLeft = false; break;
                        case 'ArrowDown': case 'KeyS': moveBackward = false; break;
                        case 'ArrowRight': case 'KeyD': moveRight = false; break;
                    }
                };

                document.addEventListener('keydown', onKeyDown);
                document.addEventListener('keyup', onKeyUp);
            } else {
                document.getElementById('instructions').style.display = 'none';
                document.getElementById('blocker').style.display = 'none';
                document.getElementById('crosshair').style.display = 'none';

                const joystickZone = document.createElement('div');
                joystickZone.style.position = 'absolute';
                joystickZone.style.bottom = '40px';
                joystickZone.style.left = '40px';
                joystickZone.style.width = '120px';
                joystickZone.style.height = '120px';
                joystickZone.style.zIndex = '100';
                document.body.appendChild(joystickZone);

                const manager = nipplejs.create({
                    zone: joystickZone,
                    mode: 'static',
                    position: { left: '50%', top: '50%' },
                    color: 'white',
                    size: 90
                });

                manager.on('move', function (evt, data) {
                    const forward = data.vector.y;
                    const turn = data.vector.x;

                    if (forward > 0) { fwdValue = Math.abs(forward); bkdValue = 0; }
                    else if (forward < 0) { fwdValue = 0; bkdValue = Math.abs(forward); }

                    if (turn > 0) { rgtValue = Math.abs(turn); lftValue = 0; }
                    else if (turn < 0) { rgtValue = 0; lftValue = Math.abs(turn); }
                });

                manager.on('end', function () {
                    fwdValue = 0; bkdValue = 0; lftValue = 0; rgtValue = 0;
                });

                document.body.addEventListener('touchstart', function(e) {
                    for (let i = 0; i < e.changedTouches.length; i++) {
                        if (e.changedTouches[i].clientX > window.innerWidth / 2) {
                            previousTouchLook.x = e.changedTouches[i].clientX;
                            previousTouchLook.y = e.changedTouches[i].clientY;
                        }
                    }
                }, { passive: false });

                document.body.addEventListener('touchmove', function(e) {
                    for (let i = 0; i < e.changedTouches.length; i++) {
                        if (e.changedTouches[i].clientX > window.innerWidth / 2) {
                            let movementX = e.changedTouches[i].clientX - previousTouchLook.x;
                            let movementY = e.changedTouches[i].clientY - previousTouchLook.y;

                            lon += movementX * 0.35;
                            lat -= movementY * 0.35;
                            lat = Math.max(-80, Math.min(80, lat));

                            previousTouchLook.x = e.changedTouches[i].clientX;
                            previousTouchLook.y = e.changedTouches[i].clientY;
                        }
                    }
                }, { passive: false });
            }

            document.getElementById('cam-toggle-btn').addEventListener('click', toggleCameraView);
        }

        function toggleCameraView() {
            isThirdPerson = !isThirdPerson;
            const textEl = document.getElementById('cam-mode-text');
            if (textEl) {
                textEl.textContent = isThirdPerson ? "Kamera: 3. Şahıs (C)" : "Kamera: 1. Şahıs (C)";
            }
        }

        function onWindowResize() {
            const aspect = window.innerWidth / window.innerHeight;
            camera.aspect = aspect;
            camera.updateProjectionMatrix();
            if (tpCamera) {
                tpCamera.aspect = aspect;
                tpCamera.updateProjectionMatrix();
            }
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- Animation Loop ---
        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();
            const delta = Math.min((time - prevTime) / 1000, 0.1);

            const playerPos = (!isMobile && controls) ? controls.getObject().position : camera.position;

            if (!isMobile && controls && controls.isLocked === true) {
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;

                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();

                const speed = 75.0;
                if (moveForward || moveBackward) velocity.z -= direction.z * speed * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * speed * delta;

                const euler = new THREE.Euler(0, 0, 0, 'YXZ');
                euler.setFromQuaternion(controls.getObject().quaternion);

                const fwd = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), euler.y);
                const rgt = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), euler.y);

                const stepZ = fwd.multiplyScalar(-velocity.z * delta);
                const stepX = rgt.multiplyScalar(-velocity.x * delta);
                const totalStep = stepZ.add(stepX);

                const nextX = playerPos.x + totalStep.x;
                if (isPositionWalkable(nextX, playerPos.z, 0.3)) {
                    playerPos.x = nextX;
                }

                const nextZ = playerPos.z + totalStep.z;
                if (isPositionWalkable(playerPos.x, nextZ, 0.3)) {
                    playerPos.z = nextZ;
                }

                playerPos.y = 1.7; // Human eye height
            } else if (isMobile) {
                phi = THREE.MathUtils.degToRad(90 - lat);
                theta = THREE.MathUtils.degToRad(lon);
                const targetPosition = new THREE.Vector3();
                targetPosition.x = camera.position.x + 100 * Math.sin(phi) * Math.cos(theta);
                targetPosition.y = camera.position.y + 100 * Math.cos(phi);
                targetPosition.z = camera.position.z + 100 * Math.sin(phi) * Math.sin(theta);
                camera.lookAt(targetPosition);

                const speed = 7.5;
                const forwardVec = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
                forwardVec.y = 0; forwardVec.normalize();

                const rightVec = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
                rightVec.y = 0; rightVec.normalize();

                let moveStep = new THREE.Vector3();
                if (fwdValue > 0) moveStep.addScaledVector(forwardVec, speed * delta * fwdValue);
                if (bkdValue > 0) moveStep.addScaledVector(forwardVec, -speed * delta * bkdValue);
                if (rgtValue > 0) moveStep.addScaledVector(rightVec, speed * delta * rgtValue);
                if (lftValue > 0) moveStep.addScaledVector(rightVec, -speed * delta * lftValue);

                const nextX = playerPos.x + moveStep.x;
                if (isPositionWalkable(nextX, playerPos.z, 0.3)) {
                    playerPos.x = nextX;
                }

                const nextZ = playerPos.z + moveStep.z;
                if (isPositionWalkable(playerPos.x, nextZ, 0.3)) {
                    playerPos.z = nextZ;
                }

                playerPos.y = 1.7;
            }

            prevTime = time;

            // Update Current Room HUD Indicator
            updateRoomIndicator(playerPos.z);

            // Global Camera Yaw for Avatar and 3rd Person View
            const euler = new THREE.Euler(0, 0, 0, 'YXZ');
            if (isMobile) {
                euler.setFromQuaternion(camera.quaternion);
            } else if (controls) {
                euler.setFromQuaternion(controls.getObject().quaternion);
            }

            // --- Avatar Update & Animation Crossfades ---
            if (avatarGroup) {
                avatarGroup.position.set(playerPos.x, 0, playerPos.z);

                let moveDir = new THREE.Vector3();
                if (!isMobile && controls && controls.isLocked) {
                    if (moveForward) moveDir.z = -1;
                    if (moveBackward) moveDir.z = 1;
                    if (moveLeft) moveDir.x = -1;
                    if (moveRight) moveDir.x = 1;
                } else if (isMobile) {
                    if (fwdValue > 0) moveDir.z = -1;
                    if (bkdValue > 0) moveDir.z = 1;
                    if (lftValue > 0) moveDir.x = -1;
                    if (rgtValue > 0) moveDir.x = 1;
                }

                const isMoving = moveDir.lengthSq() > 0;

                if (isMoving) {
                    moveDir.normalize();
                    moveDir.applyAxisAngle(new THREE.Vector3(0, 1, 0), euler.y);

                    const targetAngle = Math.atan2(moveDir.x, moveDir.z);
                    let diff = targetAngle - avatarGroup.rotation.y;
                    diff = Math.atan2(Math.sin(diff), Math.cos(diff));
                    avatarGroup.rotation.y += diff * 14 * delta;

                    if (walkAction && currentAction !== walkAction) {
                        if (currentAction) currentAction.fadeOut(0.2);
                        walkAction.reset().fadeIn(0.2).play();
                        currentAction = walkAction;
                    } else if (!walkAction && currentAction && !currentAction.isRunning()) {
                        currentAction.play();
                    }
                } else {
                    if (idleAction && currentAction !== idleAction) {
                        if (currentAction) currentAction.fadeOut(0.2);
                        idleAction.reset().fadeIn(0.2).play();
                        currentAction = idleAction;
                    }
                }

                if (avatarMixer) {
                    avatarMixer.update(delta);
                }
            }

            // --- 3rd Person Camera Logic with Wall Clipping Protection ---
            let activeCamera = isThirdPerson ? tpCamera : camera;

            if (isThirdPerson) {
                const maxDist = 3.6;
                const dir = new THREE.Vector3(0, 0, 1).applyAxisAngle(new THREE.Vector3(0, 1, 0), euler.y);

                let safeDist = maxDist;
                for (let d = maxDist; d >= 1.2; d -= 0.4) {
                    const testPos = playerPos.clone().add(dir.clone().multiplyScalar(d));
                    if (isPositionWalkable(testPos.x, testPos.z, 0.4)) {
                        safeDist = d;
                        break;
                    }
                }

                tpCamera.position.copy(playerPos).add(dir.multiplyScalar(safeDist));
                tpCamera.position.y = playerPos.y + 0.9;

                const targetPoint = new THREE.Vector3(0, 0, -10);
                targetPoint.applyAxisAngle(new THREE.Vector3(0, 1, 0), euler.y);
                targetPoint.add(playerPos);
                targetPoint.y = playerPos.y - 0.2;
                tpCamera.lookAt(targetPoint);
            }

            renderer.render(scene, activeCamera);
        }
    </script>
