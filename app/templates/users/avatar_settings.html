{% extends "base.html" %}

{% block title %}Avatar Düzenle — ShutterGallery{% endblock %}

{% block content %}
<div class="max-w-6xl mx-auto px-4 py-8 md:py-12 mt-16 md:mt-0 flex flex-col md:flex-row gap-8">
    
    <!-- Sol Panel: Renk Seçiciler -->
    <div class="w-full md:w-1/3 bg-zinc-900 border border-white/5 rounded-2xl p-6 shadow-2xl h-fit">
        <h2 class="text-2xl font-bold text-white mb-6 font-mono uppercase tracking-widest border-b border-white/10 pb-4">
            Avatar <span class="text-[#A3B18A]">Düzenle</span>
        </h2>
        
        <p class="text-zinc-400 text-sm mb-8">
            3D Galeride kendi bakış açınızdan (aşağı baktığınızda) görünecek olan karakterinizin renklerini seçin.
        </p>
        
        <form id="avatar-form" class="space-y-6">
            <div>
                <label class="block text-zinc-300 text-xs font-bold uppercase tracking-wider mb-2">Avatar Rengi</label>
                <div class="flex items-center gap-4">
                    <input type="color" id="color-body" value="#2196F3" class="w-12 h-12 rounded cursor-pointer bg-transparent border-0 p-0">
                    <span id="hex-body" class="text-zinc-500 font-mono text-sm uppercase">#2196F3</span>
                </div>
            </div>
            
            <div class="pt-6 border-t border-white/10">
                <button type="submit" id="save-btn" class="w-full bg-[#829A73] hover:bg-[#A3B18A] text-white font-bold py-3 px-4 rounded-xl transition-colors shadow-[0_0_15px_rgba(163,177,138,0.3)] hover:shadow-[0_0_25px_rgba(163,177,138,0.5)] uppercase tracking-widest text-sm flex justify-center items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg>
                    <span>Kaydet</span>
                </button>
            </div>
        </form>
    </div>
    
    <!-- Sağ Panel: 3D Önizleme -->
    <div class="w-full md:w-2/3 bg-zinc-900 border border-white/5 rounded-2xl overflow-hidden shadow-2xl relative" style="height: 60vh; min-height: 400px;">
        <!-- Loading Spinner -->
        <div id="loading" class="absolute inset-0 flex items-center justify-center bg-black/50 z-10">
            <div class="w-12 h-12 border-4 border-[#A3B18A] border-t-transparent rounded-full animate-spin"></div>
        </div>
        
        <canvas id="avatar-canvas" class="w-full h-full block"></canvas>
        
        <div class="absolute bottom-4 left-0 right-0 text-center pointer-events-none">
            <span class="bg-black/50 text-white/80 px-4 py-1.5 rounded-full text-xs font-mono tracking-widest backdrop-blur-sm border border-white/10">
                FAREYİ SÜRÜKLEYEREK DÖNDÜR
            </span>
        </div>
    </div>
</div>

<!-- Three.js -->
<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>

<script>
    // Kullanıcının mevcut konfigürasyonu
    const rawConfig = '{{ current_user.avatar_config|safe }}';
    let currentConfig = { body: '#2196F3', arms: '#4CAF50', legs: '#FFC107' };
    
    try {
        if (rawConfig && rawConfig !== 'None') {
            currentConfig = JSON.parse(rawConfig);
        }
    } catch(e) { console.error("Config parse error:", e); }

    // HTML elementlerini güncelle
    const inBody = document.getElementById('color-body');
    const hBody = document.getElementById('hex-body');

    inBody.value = currentConfig.body || '#2196F3';
    hBody.textContent = inBody.value.toUpperCase();

    // ── 3D ÖNİZLEME SAHNESİ ───────────────────────────────────────
    const canvas = document.getElementById('avatar-canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const scene = new THREE.Scene();
    
    // Kamera (Biraz yukarıdan, FPS açısını simüle edecek şekilde ama 3. şahıs bakışı gibi)
    const camera = new THREE.PerspectiveCamera(45, canvas.clientWidth / canvas.clientHeight, 0.1, 100);
    camera.position.set(0, 4, 8);
    
    // Kontroller
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enablePan = false;
    controls.minDistance = 3;
    controls.maxDistance = 12;
    controls.target.set(0, 2, 0);
    controls.update();

    // Işıklandırma
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);
    
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(5, 10, 5);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 1024;
    dirLight.shadow.mapSize.height = 1024;
    scene.add(dirLight);

    // Zemin
    const grid = new THREE.GridHelper(10, 10, 0xffffff, 0xffffff);
    grid.material.opacity = 0.1;
    grid.material.transparent = true;
    scene.add(grid);

    // Avatar Materyalleri
    const matBody = new THREE.MeshStandardMaterial({ color: currentConfig.body, roughness: 0.7 });
    const matArms = new THREE.MeshStandardMaterial({ color: currentConfig.arms, roughness: 0.7 });
    const matLegs = new THREE.MeshStandardMaterial({ color: currentConfig.legs, roughness: 0.7 });
    // Head (Sadece önizleme için var, galeride gizli olacak)
    const matHead = new THREE.MeshStandardMaterial({ color: '#f5d0b5', roughness: 0.5 }); 

    // Avatar Grubu
    const avatarGroup = new THREE.Group();
    avatarGroup.scale.set(1.5, 1.5, 1.5);
    scene.add(avatarGroup);

    let armL, armR, legL, legR;

    const loader = new THREE.OBJLoader();
    loader.load("{{ url_for('static', filename='models/hff/HumanBody.obj') }}", function ( object ) {
        
        object.traverse( function ( child ) {
            if ( child.isMesh ) {
                child.castShadow = true;
                child.receiveShadow = true;
                child.material = matBody; 
                
                const n = child.name.toLowerCase();
                if (n.includes("arm") && n.includes("l")) armL = child;
                if (n.includes("arm") && n.includes("r")) armR = child;
                if (n.includes("leg") && n.includes("l")) legL = child;
                if (n.includes("leg") && n.includes("r")) legR = child;
            }
        } );

        // OBJ modelleri genelde metre cinsindendir
        object.scale.set(1, 1, 1);
        object.position.y = -1.5; // Center it vertically (adjusted)
        
        object.rotation.x = -Math.PI / 2;
        object.rotation.z = Math.PI; 
        
        avatarGroup.add(object);
        document.getElementById('loading').style.display = 'none';
    }, undefined, function ( error ) {
        console.error( error );
        document.getElementById('loading').innerHTML = '<span class="text-red-500">Model yüklenemedi</span>';
    });

    document.getElementById('loading').style.display = 'none';

    // Renk Değişim Eventleri
    function updateColors() {
        matBody.color.set(inBody.value);
        hBody.textContent = inBody.value.toUpperCase();
    }

    inBody.addEventListener('input', updateColors);

    // Resize Handle
    function resize() {
        const parent = canvas.parentElement;
        const w = parent.clientWidth;
        const h = parent.clientHeight;
        renderer.setSize(w, h, false);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', resize);
    resize(); // İlk boyutlandırma

    // Animasyon Döngüsü
    let clock = new THREE.Clock();
    function animate() {
        requestAnimationFrame(animate);
        
        // Hafif yürüme animasyonu (Önizleme için)
        const t = clock.getElapsedTime() * 3;
        if (armL && armR && legL && legR) {
            armL.rotation.x = Math.sin(t) * 0.5;
            armR.rotation.x = Math.sin(t + Math.PI) * 0.5;
            legL.rotation.x = Math.sin(t + Math.PI) * 0.5;
            legR.rotation.x = Math.sin(t) * 0.5;
        } else {
            avatarGroup.position.y = -1.5 + Math.abs(Math.sin(t * 1.5) * 0.2);
        }
        
        controls.update();
        renderer.render(scene, camera);
    }
    animate();

    // ── KAYDETME İŞLEMİ ───────────────────────────────────────────
    const form = document.getElementById('avatar-form');
    const saveBtn = document.getElementById('save-btn');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        saveBtn.disabled = true;
        const btnText = saveBtn.querySelector('span');
        const originalText = btnText.textContent;
        btnText.textContent = 'Kaydediliyor...';
        
        const payload = {
            body: inBody.value,
            arms: inBody.value,
            legs: inBody.value
        };

        try {
            const res = await fetch('{{ url_for("users.avatar_settings") }}', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            
            if (res.ok) {
                btnText.textContent = 'Kaydedildi ✓';
                saveBtn.classList.replace('bg-[#829A73]', 'bg-emerald-600');
                
                setTimeout(() => {
                    btnText.textContent = originalText;
                    saveBtn.classList.replace('bg-emerald-600', 'bg-[#829A73]');
                    saveBtn.disabled = false;
                }, 2000);
            } else {
                throw new Error('Server returned error');
            }
        } catch (error) {
            console.error(error);
            btnText.textContent = 'Hata Oluştu!';
            saveBtn.classList.replace('bg-[#829A73]', 'bg-red-500');
            
            setTimeout(() => {
                btnText.textContent = originalText;
                saveBtn.classList.replace('bg-red-500', 'bg-[#829A73]');
                saveBtn.disabled = false;
            }, 2000);
        }
    });

</script>
{% endblock %}
