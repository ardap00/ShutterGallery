{% for post in posts.items %}
<div class="relative group rounded-lg overflow-hidden bg-[#FDFBF7] aspect-square border border-[#7B9A74]/10">
    <a href="{{ url_for('posts.post', post_id=post.id) }}" class="block w-full h-full">
        {% if post.image_file.startswith('http') %}
        <img src="{{ post.image_file }}" alt="{{ post.title }}" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105">
        {% else %}
        <img src="{{ url_for('static', filename='uploads/' + post.image_file) }}" alt="{{ post.title }}" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105">
        {% endif %}
    </a>
    
    <!-- Overlay -->
    <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/20 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex flex-col justify-end p-4 pointer-events-none">
        <div class="flex justify-between items-end w-full">
            <div class="flex-1 truncate pr-2">
                <h3 class="text-sm font-bold text-[#2D3A2A] truncate drop-shadow-md">{{ post.title }}</h3>
                <p class="text-[10px] text-[#A3B18A] font-mono uppercase truncate drop-shadow-md">{{ post.author.username }} <span class="text-[8px] text-[#6B7A68] ml-0.5">#{{ post.author.unique_id }}</span></p>
            </div>
            <div class="pointer-events-auto flex items-center gap-3">
                {% if current_user.is_authenticated %}
                <form action="{{ url_for('posts.like_post', post_id=post.id) }}" method="POST" class="inline">
                    <button type="submit" class="flex flex-col items-center hover:scale-110 transition-transform">
                        {% if current_user.has_liked_post(post) %}
                        <span class="text-[#D4A373] text-xl leading-none drop-shadow-md">♥</span>
                        {% else %}
                        <span class="text-[#2D3A2A] text-xl leading-none drop-shadow-md">♡</span>
                        {% endif %}
                        <span class="text-[#2D3A2A] text-[10px] font-bold">{{ post.likers.count() }}</span>
                    </button>
                </form>
                {% else %}
                <div class="flex flex-col items-center">
                    <span class="text-[#2D3A2A] text-xl leading-none drop-shadow-md">♡</span>
                    <span class="text-[#2D3A2A] text-[10px] font-bold">{{ post.likers.count() }}</span>
                </div>
                {% endif %}
            </div>
        </div>
    </div>
</div>
{% endfor %}
