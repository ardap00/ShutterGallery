<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ShutterGallery</title>
    
    <!-- PWA Settings -->
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <meta name="theme-color" content="#10b981">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" type="image/jpeg" href="{{ url_for('static', filename='shuttergallerylogo.jpeg') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='shuttergallerylogo.jpeg') }}">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="min-h-screen bg-[#FDFBF7] text-[#2D3A2A] overflow-x-hidden pb-16 md:pb-0">

    <!-- Menü (Geri dönüş düğmesi) -->
    <div class="fixed top-4 left-4 md:top-8 md:left-8 z-50">
        <button onclick="history.back()" class="text-[#6B7A68] hover:text-[#7B9A74] transition-colors flex items-center gap-2 md:gap-3 bg-white/50 px-3 py-2 md:px-4 md:py-2 rounded-full backdrop-blur-md border border-[#7B9A74]/20 shadow-sm cursor-pointer">
            <svg class="w-4 h-4 md:w-5 md:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            <span class="hidden md:inline font-mono text-[10px] md:text-xs tracking-widest uppercase">Geri</span>
        </button>

    </div>

    <!-- Uygulama Logosu -->
    <div class="fixed top-4 md:top-8 left-1/2 -translate-x-1/2 z-40 pointer-events-none text-center">
        <a href="{{ url_for('main.index') }}" class="pointer-events-auto flex items-center gap-2 hover:opacity-80 transition-opacity drop-shadow-lg">
            <img src="{{ url_for('static', filename='shuttergallerylogo.jpeg') }}" alt="ShutterGallery Logo" class="h-8 md:h-12 w-auto object-contain rounded-md shadow-lg">
            <span class="text-base md:text-xl font-bold tracking-widest text-[#2D3A2A]">Shutter<span class="text-[#7B9A74]">Gallery</span></span>
        </a>
    </div>

    <!-- Flash Mesajları -->
    <div class="fixed top-8 right-8 z-50 flex flex-col gap-2">
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="px-4 py-3 rounded-xl text-sm font-mono tracking-wide
                {% if category == 'danger' %}bg-red-500/20 border border-red-500/30 text-red-400
                {% elif category == 'success' %}bg-[#7B9A74]/20 border border-emerald-500/30 text-[#7B9A74]
                {% else %}bg-blue-500/20 border border-blue-500/30 text-[#7B9A74]{% endif %}" style="backdrop-filter: blur(10px);">
                {{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}
    </div>

    {% block content %}{% endblock %}

    <!-- Mobile Bottom Navigation Bar -->
    {% include "main/_mobile_nav.html" %}

    <!-- PWA Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/static/service-worker.js')
            .then(registration => {
              console.log('ServiceWorker registration successful with scope: ', registration.scope);
            })
            .catch(err => {
              console.log('ServiceWorker registration failed: ', err);
            });
        });
      }
    </script>
</body>
</html>
