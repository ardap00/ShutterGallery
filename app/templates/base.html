<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ShutterGallery</title>
    
    <!-- PWA Settings -->
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <meta name="theme-color" content="#10b981">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        #bg {
            position: fixed; inset: 0; z-index: -1;
            background: url('https://images.unsplash.com/photo-1536924940846-227afb31e2a5?q=80&w=1920') center/cover;
            filter: brightness(25%) blur(2px);
            transform: scale(1.02);
        }
    </style>
</head>
<body class="min-h-screen bg-black overflow-x-hidden pb-16 md:pb-0">
    <div id="bg"></div>

    <!-- Menü (Geri dönüş düğmesi) -->
    <div class="fixed top-4 left-4 md:top-8 md:left-8 z-50">
        <button onclick="history.back()" class="text-white/60 hover:text-emerald-400 transition-colors flex items-center gap-2 md:gap-3 bg-black/30 px-3 py-2 md:px-4 md:py-2 rounded-full backdrop-blur-sm border border-white/5 cursor-pointer">
            <svg class="w-4 h-4 md:w-5 md:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            <span class="hidden md:inline font-mono text-[10px] md:text-xs tracking-widest uppercase">Geri</span>
        </button>

    </div>

    <!-- Uygulama Logosu -->
    <div class="fixed top-4 md:top-8 left-1/2 -translate-x-1/2 z-40 pointer-events-none text-center">
        <a href="{{ url_for('main.index') }}" class="pointer-events-auto text-base md:text-xl font-bold tracking-widest text-white hover:text-emerald-400 transition-colors drop-shadow-lg inline-block">
            Shutter<span class="text-emerald-500">Gallery</span>
        </a>
    </div>

    <!-- Flash Mesajları -->
    <div class="fixed top-8 right-8 z-50 flex flex-col gap-2">
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="px-4 py-3 rounded-xl text-sm font-mono tracking-wide
                {% if category == 'danger' %}bg-red-500/20 border border-red-500/30 text-red-400
                {% elif category == 'success' %}bg-emerald-500/20 border border-emerald-500/30 text-emerald-400
                {% else %}bg-blue-500/20 border border-blue-500/30 text-blue-400{% endif %}" style="backdrop-filter: blur(10px);">
                {{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}
    </div>

    {% block content %}{% endblock %}

    <!-- Mobile Bottom Navigation Bar -->
    {% include "main/_mobile_nav.html" %}

    <!-- PWA Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/static/service-worker.js')
            .then(registration => {
              console.log('ServiceWorker registration successful with scope: ', registration.scope);
            })
            .catch(err => {
              console.log('ServiceWorker registration failed: ', err);
            });
        });
      }
    </script>
</body>
</html>
