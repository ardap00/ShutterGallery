<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{{ user.username }} - Çağdaş 3D Sanat Galerisi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #0284c7; 
            font-family: 'Plus Jakarta Sans', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        #blocker {
            position: absolute; width: 100%; height: 100%;
            background: radial-gradient(circle at center, rgba(15, 23, 42, 0.85) 0%, rgba(3, 7, 18, 0.95) 100%);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            color: white; text-align: center;
            z-index: 50;
            backdrop-filter: blur(12px);
            transition: opacity 0.4s ease;
        }
        #instructions {
            cursor: pointer;
            padding: 36px 48px; 
            border: 1px solid rgba(255,255,255,0.12); 
            border-radius: 24px;
            background: rgba(255,255,255,0.04);
            display: inline-block; 
            margin: 0 auto;
            backdrop-filter: blur(20px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.05);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            max-width: 90vw;
        }
        #instructions:hover {
            background: rgba(255,255,255,0.08);
            border-color: rgba(255,255,255,0.25);
            transform: translateY(-2px) scale(1.01);
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.6);
        }
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            width: 6px; height: 6px;
            background-color: rgba(255,255,255,0.9);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 5;
            display: none;
            box-shadow: 0 0 8px rgba(0,0,0,0.8);
        }
        .hud-btn {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.36);
            transition: all 0.2s ease;
        }
        .hud-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.25);
            transform: translateY(-1px);
        }
        #room-badge {
            transition: all 0.4s ease;
        }
    </style>
</head>
<body>
    <!-- Top HUD Navigation -->
    <div class="fixed top-5 left-5 z-40 flex items-center gap-3">
        <button id="back-btn" onclick="if(document.referrer) { history.back(); } else { window.location.href='{{ url_for('users.profile', username=user.username) }}'; }" class="hud-btn px-4 py-2.5 text-white rounded-xl font-semibold text-xs tracking-wider uppercase flex items-center gap-2 cursor-pointer">
            <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            <span>Profile Dön</span>
        </button>
    </div>

    <!-- Active Wing / Room Indicator -->
    <div id="room-badge" class="fixed top-5 left-1/2 -translate-x-1/2 z-40 hud-btn px-5 py-2 rounded-full text-white/90 text-xs font-semibold tracking-widest uppercase flex items-center gap-2 pointer-events-none">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        <span id="room-name">Giriş Atriumu</span>
    </div>

    <!-- Camera Mode Toggle -->
    <div class="fixed top-5 right-5 z-40 flex items-center gap-3">
        <button id="cam-toggle-btn" class="hud-btn px-4 py-2.5 text-white rounded-xl font-semibold text-xs tracking-wider uppercase flex items-center gap-2 cursor-pointer" title="Bakış Açısını Değiştir (C)">
            <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
            <span id="cam-mode-text" class="hidden sm:inline">Kamera: 3. Şahıs (C)</span>
        </button>
    </div>

    <!-- Entrance Blocker / Instructions -->
    <div id="blocker">
        <div id="instructions">
            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-xs font-semibold tracking-widest uppercase mb-4">
                Contemporary Pavilion
            </div>
            <h1 class="text-3xl md:text-4xl font-extrabold text-white tracking-tight mb-2">
                {{ user.username }} <span class="text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-400">3D Sanat Galerisi</span>
            </h1>
            <p class="text-gray-400 text-sm max-w-md mx-auto mb-6">
                Modüler çağdaş sanat salonları, panoramik cam köprüler ve ferah açık hava manzarası.
            </p>
            
            <div class="inline-block px-6 py-3 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-500 text-white font-bold text-sm tracking-wider uppercase shadow-lg shadow-emerald-500/20 mb-8 cursor-pointer transform hover:scale-105 transition-all">
                Galeriye Adım At
            </div>

            <div class="grid grid-cols-2 gap-x-10 gap-y-3 text-left text-xs text-gray-300 font-medium border-t border-white/10 pt-6 max-w-sm mx-auto">
                <div class="flex items-center gap-2">
                    <span class="px-2 py-1 rounded bg-white/10 text-white font-mono font-bold">W A S D</span>
                    <span>Yürüme</span>
                </div>
                <div class="flex items-center gap-2">
                    <span class="px-2 py-1 rounded bg-white/10 text-white font-mono font-bold">Mouse</span>
                    <span>Etrafı İncele</span>
                </div>
                <div class="flex items-center gap-2">
                    <span class="px-2 py-1 rounded bg-white/10 text-white font-mono font-bold">C</span>
                    <span>Bakış Açısı</span>
                </div>
                <div class="flex items-center gap-2">
                    <span class="px-2 py-1 rounded bg-white/10 text-white font-mono font-bold">ESC</span>
                    <span>İmleci Bırak</span>
                </div>
            </div>
        </div>
    </div>
    
    <div id="crosshair"></div>
    <div id="error-box" style="position:fixed; top:80px; left:20px; z-index:9999; background:rgba(220,38,38,0.9); color:white; padding:12px 18px; border-radius:12px; font-family:monospace; display:none; max-width: 80%; font-size:12px;"></div>

    <script>
    window.addEventListener('error', function(e) {
        const eb = document.getElementById('error-box');
        if (eb) {
            eb.style.display = 'block';
            eb.innerHTML += "Hata: " + e.message + " (" + e.filename + ":" + e.lineno + ")<br>";
        }
    });
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>
    <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || navigator.maxTouchPoints > 0;
        const photosData = {{ photos_json | safe }};

        // Core Three.js variables
        let camera, tpCamera, scene, renderer, controls;
        let isThirdPerson = true;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let prevTime = performance.now();
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();

        // Mobile control variables
        let fwdValue = 0, bkdValue = 0, rgtValue = 0, lftValue = 0;
        let previousTouchLook = { x: 0, y: 0 };
        let lon = -90, lat = 0;
        let phi = 0, theta = 0;

        // Avatar variables
        let avatarGroup;
        let avatarMixer;
        let currentAction;
        let walkAction;
        let idleAction;

        // Walkable Zones and Obstacles for collision detection
        const walkableZones = [];
        const obstacles = [];
        const zoneLabels = [];

        // Architecture Dimensions (Unified height of 16 for all halls and bridges)
        const GALLERY_HEIGHT = 16;
        const ATRIUM_LENGTH = 36;
        const ATRIUM_WIDTH = 34;

        const PAVILION_WIDTH = 34;
        const PHOTOS_PER_PAVILION = 6;
        const PHOTO_Z_SPACING = 20;

        const BRIDGE_WIDTH = 22;
        const BRIDGE_LENGTH = 22;

        init();
        animate();

        // --- 360° Sky Dome Texture (Blue Sky, Clouds and Sun) ---
        function createSkyTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 2048;
            canvas.height = 1024;
            const ctx = canvas.getContext('2d');

            // Rich vertical sky gradient
            const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            grad.addColorStop(0.0, '#0284c7'); // Azure blue at zenith
            grad.addColorStop(0.35, '#38bdf8'); // Sky blue
            grad.addColorStop(0.60, '#7dd3fc'); // Soft cyan
            grad.addColorStop(0.72, '#bae6fd'); // Light sky horizon
            grad.addColorStop(0.80, '#f0f9ff'); // Horizon haze
            grad.addColorStop(0.88, '#cbd5e1'); // Distant mountains
            grad.addColorStop(1.0, '#475569'); // Earth horizon
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Sun glow
            const sunGrad = ctx.createRadialGradient(820, 380, 10, 820, 380, 240);
            sunGrad.addColorStop(0, 'rgba(255, 255, 245, 1)');
            sunGrad.addColorStop(0.2, 'rgba(254, 240, 138, 0.75)');
            sunGrad.addColorStop(0.5, 'rgba(186, 230, 253, 0.35)');
            sunGrad.addColorStop(1, 'rgba(186, 230, 253, 0)');
            ctx.fillStyle = sunGrad;
            ctx.beginPath();
            ctx.arc(820, 380, 240, 0, Math.PI * 2);
            ctx.fill();

            // Fluffy white clouds along the sky
            ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
            for (let i = 0; i < 40; i++) {
                const cx = (i * 103) % canvas.width;
                const cy = 240 + (i * 39) % 240;
                const rx = 100 + (i * 29) % 150;
                const ry = 22 + (i * 13) % 40;
                ctx.beginPath();
                ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
                ctx.fill();
            }

            const texture = new THREE.CanvasTexture(canvas);
            texture.mapping = THREE.EquirectangularReflectionMapping;
            texture.colorSpace = THREE.SRGBColorSpace;
            return texture;
        }

        // --- Procedural Canvas Textures for Realistic PBR Architectural Materials ---
        function createTerrazzoTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 1024;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#e8ecf1';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const colors = ['#ffffff', '#cbd5e1', '#94a3b8', '#64748b', '#d97706', '#f1f5f9'];
            for (let i = 0; i < 4500; i++) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                const r = Math.random() * 3 + 1;
                ctx.fillStyle = colors[Math.floor(Math.random() * colors.length)];
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fill();
            }

            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imgData.data;
            for (let i = 0; i < data.length; i += 4) {
                const noise = (Math.random() - 0.5) * 10;
                data[i] = Math.min(255, Math.max(0, data[i] + noise));
                data[i+1] = Math.min(255, Math.max(0, data[i+1] + noise));
                data[i+2] = Math.min(255, Math.max(0, data[i+2] + noise));
            }
            ctx.putImageData(imgData, 0, 0);

            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            return texture;
        }

        function createWoodBridgeTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 1024;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#1c1917';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const plankWidth = 64;
            ctx.strokeStyle = '#0c0a09';
            ctx.lineWidth = 3;
            for (let x = 0; x < canvas.width; x += plankWidth) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();

                ctx.fillStyle = `rgba(255, 255, 255, ${Math.random() * 0.04})`;
                ctx.fillRect(x, 0, plankWidth, canvas.height);
            }

            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            return texture;
        }

        function createMuseumWallTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#f8fafc';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imgData.data;
            for (let i = 0; i < data.length; i += 4) {
                const noise = (Math.random() - 0.5) * 12;
                data[i] = Math.min(255, Math.max(0, data[i] + noise));
                data[i+1] = Math.min(255, Math.max(0, data[i+1] + noise));
                data[i+2] = Math.min(255, Math.max(0, data[i+2] + noise));
            }
            ctx.putImageData(imgData, 0, 0);

            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            return texture;
        }

        function createPlaqueTexture(photo) {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 680;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.lineWidth = 8;
            ctx.strokeRect(8, 8, canvas.width - 16, canvas.height - 16);

            ctx.fillStyle = '#10b981';
            ctx.fillRect(40, 40, 12, 100);

            // Title
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 56px sans-serif';
            ctx.textAlign = 'left';
            const title = (photo.title || 'İsimsiz Eser').substring(0, 30);
            ctx.fillText(title, 70, 105);

            // Description (word wrap)
            ctx.fillStyle = '#94a3b8';
            ctx.font = '36px sans-serif';
            const desc = photo.description || 'ShutterGallery sergi koleksiyonundan bir kare.';
            const words = desc.split(' ');
            let line = '';
            let y = 200;
            for (let n = 0; n < words.length; n++) {
                let testLine = line + words[n] + ' ';
                let metrics = ctx.measureText(testLine);
                if (metrics.width > canvas.width - 120 && n > 0) {
                    ctx.fillText(line, 50, y);
                    line = words[n] + ' ';
                    y += 48;
                    if (y > 350) break;
                } else {
                    line = testLine;
                }
            }
            ctx.fillText(line, 50, y);

            // Divider Line
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(50, 420);
            ctx.lineTo(canvas.width - 50, 420);
            ctx.stroke();

            // EXIF Camera Information
            ctx.font = 'bold 30px monospace';
            ctx.fillStyle = '#38bdf8';
            ctx.fillText('EXIF METRİKLERİ', 50, 470);

            ctx.font = '28px monospace';
            ctx.fillStyle = '#cbd5e1';
            let exif1 = [];
            if (photo.camera_model) exif1.push(`Kamera: ${photo.camera_model}`);
            if (photo.lens_model) exif1.push(`Lens: ${photo.lens_model}`);
            ctx.fillText(exif1.join('  |  ') || 'Kamera bilgisi girilmedi', 50, 525);

            let exif2 = [];
            if (photo.iso) exif2.push(`ISO ${photo.iso}`);
            if (photo.aperture) exif2.push(`f/${photo.aperture}`);
            if (photo.shutter_speed) exif2.push(`${photo.shutter_speed}s`);
            ctx.fillText(exif2.join('   •   ') || 'Pozlama ayarları saklı', 50, 575);

            const texture = new THREE.CanvasTexture(canvas);
            return texture;
        }

        function createWelcomeBannerTexture(username) {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 768;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = 'rgba(15, 23, 42, 0.96)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = '#10b981';
            ctx.lineWidth = 14;
            ctx.strokeRect(12, 12, canvas.width - 24, canvas.height - 24);

            ctx.fillStyle = '#10b981';
            ctx.font = 'bold 38px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('SHUTTERGALLERY • CONTEMPORARY WING', canvas.width / 2, 120);

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 64px sans-serif';
            ctx.fillText(`${username.toUpperCase()} RETROSPECTIVE`, canvas.width / 2, 260);

            ctx.fillStyle = '#94a3b8';
            ctx.font = '36px sans-serif';
            ctx.fillText('Küratörlü 3D Fotoğraf Sergisi', canvas.width / 2, 360);

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(120, 430);
            ctx.lineTo(canvas.width - 120, 430);
            ctx.stroke();

            ctx.fillStyle = '#cbd5e1';
            ctx.font = '32px sans-serif';
            ctx.fillText('WASD ile yürüyün, C tuşuyla bakış açısını değiştirin.', canvas.width / 2, 510);

            ctx.fillStyle = '#38bdf8';
            ctx.font = 'bold 34px monospace';
            ctx.fillText('↓ SERGİ SALONLARINA DOĞRU İLERLEYİN ↓', canvas.width / 2, 630);

            return new THREE.CanvasTexture(canvas);
        }

        // --- Main Init Function ---
        function init() {
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.5, 2000);
            camera.position.set(0, 8, 20);

            tpCamera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.5, 2000);

            scene = new THREE.Scene();

            // Set Equirectangular Blue Sky with Clouds
            const skyTex = createSkyTexture();
            scene.background = skyTex;
            scene.environment = skyTex;

            // Soft distant horizon fog
            scene.fog = new THREE.Fog(0xbae6fd, 300, 1000);

            // Ambient / Sky Lighting
            const hemiLight = new THREE.HemisphereLight(0xffffff, 0xcfd8dc, 0.9);
            scene.add(hemiLight);

            // Global Directional Sun pouring through skylights and windows
            const sunLight = new THREE.DirectionalLight(0xfffbeb, 1.3);
            sunLight.position.set(40, 80, 30);
            scene.add(sunLight);

            // Outdoor Lush Green Courtyard Lawn
            const outdoorGeo = new THREE.PlaneGeometry(1000, 1000);
            const outdoorMat = new THREE.MeshStandardMaterial({ color: 0x3b7a57, roughness: 0.85 });
            const outdoorGround = new THREE.Mesh(outdoorGeo, outdoorMat);
            outdoorGround.rotation.x = -Math.PI / 2;
            outdoorGround.position.set(0, -0.15, -100);
            scene.add(outdoorGround);

            // Load Materials
            const terrazzoTex = createTerrazzoTexture();
            terrazzoTex.repeat.set(12, 12);
            const floorMat = new THREE.MeshStandardMaterial({
                map: terrazzoTex,
                roughness: 0.35,
                metalness: 0.05,
                color: 0xffffff
            });

            const woodBridgeTex = createWoodBridgeTexture();
            woodBridgeTex.repeat.set(4, 4);
            const bridgeFloorMat = new THREE.MeshStandardMaterial({
                map: woodBridgeTex,
                roughness: 0.5,
                metalness: 0.1
            });

            const wallTex = createMuseumWallTexture();
            wallTex.repeat.set(8, 4);
            const wallMat = new THREE.MeshStandardMaterial({
                map: wallTex,
                roughness: 0.85,
                color: 0xffffff
            });

            const darkAccentMat = new THREE.MeshStandardMaterial({
                color: 0x1e293b,
                roughness: 0.3,
                metalness: 0.8
            });

            // Crystal clear glass material for panoramic sky views
            const glassMat = new THREE.MeshStandardMaterial({
                color: 0xbae6fd,
                transparent: true,
                opacity: 0.22,
                roughness: 0.1,
                metalness: 0.1
            });

            const frameMat = new THREE.MeshStandardMaterial({
                color: 0x0f172a,
                roughness: 0.25,
                metalness: 0.85
            });

            const paspartuMat = new THREE.MeshStandardMaterial({
                color: 0xfbfbfb,
                roughness: 0.95
            });

            const benchWoodMat = new THREE.MeshStandardMaterial({
                color: 0x27272a,
                roughness: 0.4
            });

            const gltfLoader = new GLTFLoader();

            // --- BUILD ARCHITECTURE ---

            // 1. Grand Atrium (Entrance Foyer)
            // Z ranges from +32 down to -4
            buildAtrium({
                scene, floorMat, wallMat, darkAccentMat, glassMat,
                benchWoodMat,
                width: ATRIUM_WIDTH,
                length: ATRIUM_LENGTH,
                height: GALLERY_HEIGHT,
                startZ: 32
            });

            // Calculate number of pavilions needed for photos
            const numPavilions = Math.max(1, Math.ceil(photosData.length / PHOTOS_PER_PAVILION));
            let currentZ = 32 - ATRIUM_LENGTH; // Starts at -4

            for (let i = 0; i < numPavilions; i++) {
                const pStartIndex = i * PHOTOS_PER_PAVILION;
                const pPhotos = photosData.slice(pStartIndex, pStartIndex + PHOTOS_PER_PAVILION);
                const pLength = Math.max(56, Math.ceil(Math.max(1, pPhotos.length) / 2) * PHOTO_Z_SPACING + 16);

                const hasNextSection = (i < numPavilions - 1);

                // Build Pavilion
                buildPavilion({
                    scene, floorMat, wallMat, darkAccentMat, glassMat,
                    frameMat, paspartuMat, benchWoodMat,
                    pavilionIndex: i + 1,
                    photos: pPhotos,
                    width: PAVILION_WIDTH,
                    length: pLength,
                    height: GALLERY_HEIGHT,
                    startZ: currentZ,
                    connectsToBridge: hasNextSection

            // Build Concluding Observational Lounge at the end of the museum

            // Load Cyberpunk Anime Avatar

            // Setup Controls

            // Renderer Setup
            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            const maxPixelRatio = isMobile ? 1.0 : Math.min(window.devicePixelRatio, 2.0);

        function buildPavilion({ scene, floorMat, wallMat, darkAccentMat, glassMat, frameMat, paspartuMat, benchWoodMat, pavilionIndex, photos, width, length, height, startZ, connectsToBridge }) {

                    texture.colorSpace = THREE.SRGBColorSpace;

                    texture.minFilter = THREE.LinearMipmapLinearFilter;
                    texture.magFilter = THREE.LinearFilter;
                    texture.generateMipmaps = true;

                    const aspect = (texture.image && texture.image.height > 0) ? (texture.image.width / texture.image.height) : 1.33;
                    let photoH = 8.5;
                    let photoW = photoH * aspect;
                    if (photoW > 14) {
                        photoW = 14;
                        photoH = photoW / aspect;

        // --- Collision System: Multi-Zone Union Checker ---

        function isPointInWalkableZones(x, z, radius = 1.6) {
            for (let i = 0; i < walkableZones.length; i++) {
                const zone = walkableZones[i];
                if (x >= zone.minX + radius && x <= zone.maxX - radius &&
                    z >= zone.minZ + radius && z <= zone.maxZ - radius) {
                    return true;
                }
            }
            return false;
        }

        function collidesWithObstacle(x, z) {
            for (let i = 0; i < obstacles.length; i++) {
                const obs = obstacles[i];
                const dx = x - obs.x;
                const dz = z - obs.z;
                if ((dx * dx + dz * dz) < (obs.radius * obs.radius)) {
                    return true;
                }
            }
            return false;
        }

        function updateRoomIndicator(currentZ) {
            const badge = document.getElementById('room-name');
            if (!badge) return;
            for (let i = 0; i < zoneLabels.length; i++) {
                const z = zoneLabels[i];
                if (currentZ >= z.minZ && currentZ <= z.maxZ) {
                    if (badge.textContent !== z.name) {
                        badge.textContent = z.name;
                    }
                    return;
                }
            }
        }

        // --- Avatar Loader & Animation System ---

        function loadAvatar() {
            avatarGroup = new THREE.Group();
            scene.add(avatarGroup);

            const loader = new GLTFLoader();
            loader.load('{{ url_for("static", filename="models/lowpoly_anime_character_cyberstyle.glb") }}', function (gltf) {
                const model = gltf.scene;

                // Scale tuned to 4.5x for perfect human proportions
                model.scale.set(4.5, 4.5, 4.5);
                model.position.set(0, 0, 0);

                model.traverse(function (node) {
                    if (node.isMesh) {
                        node.castShadow = true;
                        node.receiveShadow = true;
                        if (node.material) {
                            node.material.roughness = 0.6;
                        }
                    }
                });

                avatarGroup.add(model);

                // GLTF Animations (Idle and Walk)
                if (gltf.animations && gltf.animations.length > 0) {
                    avatarMixer = new THREE.AnimationMixer(model);

                    for (let i = 0; i < gltf.animations.length; i++) {
                        const clip = gltf.animations[i];
                        const name = clip.name.toLowerCase();

                        if (name.includes('walk') || name.includes('run')) {
                            walkAction = avatarMixer.clipAction(clip);
                        } else if (name.includes('idle') || name.includes('stand') || name.includes('breath') || name.includes('wait')) {
                            idleAction = avatarMixer.clipAction(clip);
                        }
                    }

                    if (!walkAction && gltf.animations.length > 0) walkAction = avatarMixer.clipAction(gltf.animations[0]);
                    if (!idleAction && gltf.animations.length > 1) idleAction = avatarMixer.clipAction(gltf.animations[1]);
                    if (!idleAction && walkAction) idleAction = walkAction;

                    if (idleAction) {
                        currentAction = idleAction;
                        currentAction.play();
                    }
                }
            }, undefined, function (error) {
                console.error("Avatar failed to load:", error);
            });
        }

        // --- PC & Mobile Controls Setup ---

        function setupControls() {
            if (!isMobile) {
                controls = new PointerLockControls(camera, document.body);

                const blocker = document.getElementById('blocker');
                const instructions = document.getElementById('instructions');
                const crosshair = document.getElementById('crosshair');

                instructions.addEventListener('click', function () {
                    controls.lock();
                });

                controls.addEventListener('lock', function () {
                    instructions.style.display = 'none';
                    blocker.style.display = 'none';
                    crosshair.style.display = 'block';
                });

                controls.addEventListener('unlock', function () {
                    blocker.style.display = 'flex';
                    instructions.style.display = '';
                    crosshair.style.display = 'none';
                });

                scene.add(controls.getObject());

                const onKeyDown = function (event) {
                    switch (event.code) {
                        case 'ArrowUp': case 'KeyW': moveForward = true; break;
                        case 'ArrowLeft': case 'KeyA': moveLeft = true; break;
                        case 'ArrowDown': case 'KeyS': moveBackward = true; break;
                        case 'ArrowRight': case 'KeyD': moveRight = true; break;
                        case 'KeyC': toggleCameraView(); break;
                    }
                };

                const onKeyUp = function (event) {
                    switch (event.code) {
                        case 'ArrowUp': case 'KeyW': moveForward = false; break;
                        case 'ArrowLeft': case 'KeyA': moveLeft = false; break;
                        case 'ArrowDown': case 'KeyS': moveBackward = false; break;
                        case 'ArrowRight': case 'KeyD': moveRight = false; break;
                    }
                };

                document.addEventListener('keydown', onKeyDown);
                document.addEventListener('keyup', onKeyUp);
            } else {
                // Mobile Interface Setup
                document.getElementById('instructions').style.display = 'none';
                document.getElementById('blocker').style.display = 'none';
                document.getElementById('crosshair').style.display = 'none';

                const joystickZone = document.createElement('div');
                joystickZone.style.position = 'absolute';
                joystickZone.style.bottom = '40px';
                joystickZone.style.left = '40px';
                joystickZone.style.width = '120px';
                joystickZone.style.height = '120px';
                joystickZone.style.zIndex = '100';
                document.body.appendChild(joystickZone);

                const manager = nipplejs.create({
                    zone: joystickZone,
                    mode: 'static',
                    position: { left: '50%', top: '50%' },
                    color: 'white',
                    size: 90
                });

                manager.on('move', function (evt, data) {
                    const forward = data.vector.y;
                    const turn = data.vector.x;

                    if (forward > 0) { fwdValue = Math.abs(forward); bkdValue = 0; }
                    else if (forward < 0) { fwdValue = 0; bkdValue = Math.abs(forward); }

                    if (turn > 0) { rgtValue = Math.abs(turn); lftValue = 0; }
                    else if (turn < 0) { rgtValue = 0; lftValue = Math.abs(turn); }
                });

                manager.on('end', function () {
                    fwdValue = 0; bkdValue = 0; lftValue = 0; rgtValue = 0;
                });

                document.body.addEventListener('touchstart', function(e) {
                    for (let i = 0; i < e.changedTouches.length; i++) {
                        if (e.changedTouches[i].clientX > window.innerWidth / 2) {
                            previousTouchLook.x = e.changedTouches[i].clientX;
                            previousTouchLook.y = e.changedTouches[i].clientY;
                        }
                    }
                }, { passive: false });

                document.body.addEventListener('touchmove', function(e) {
                    for (let i = 0; i < e.changedTouches.length; i++) {
                        if (e.changedTouches[i].clientX > window.innerWidth / 2) {
                            let movementX = e.changedTouches[i].clientX - previousTouchLook.x;
                            let movementY = e.changedTouches[i].clientY - previousTouchLook.y;

                            lon += movementX * 0.4;
                            lat -= movementY * 0.4;
                            lat = Math.max(-85, Math.min(85, lat));

                            previousTouchLook.x = e.changedTouches[i].clientX;
                            previousTouchLook.y = e.changedTouches[i].clientY;
                        }
                    }
                }, { passive: false });
            }

            document.getElementById('cam-toggle-btn').addEventListener('click', toggleCameraView);
        }

        function toggleCameraView() {
            isThirdPerson = !isThirdPerson;
            const textEl = document.getElementById('cam-mode-text');
            if (textEl) {
                textEl.textContent = isThirdPerson ? "Kamera: 3. Şahıs (C)" : "Kamera: 1. Şahıs (C)";
            }
        }

        function onWindowResize() {
            const aspect = window.innerWidth / window.innerHeight;
            camera.aspect = aspect;
            camera.updateProjectionMatrix();
            if (tpCamera) {
                tpCamera.aspect = aspect;
                tpCamera.updateProjectionMatrix();
            }
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- Animation Loop ---

        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();
            const delta = Math.min((time - prevTime) / 1000, 0.1);

            // Position Vector to update
            const playerPos = (!isMobile && controls) ? controls.getObject().position : camera.position;

            if (!isMobile && controls && controls.isLocked === true) {
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;

                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();

                const speed = 100.0;
                if (moveForward || moveBackward) velocity.z -= direction.z * speed * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * speed * delta;

                const euler = new THREE.Euler(0, 0, 0, 'YXZ');
                euler.setFromQuaternion(controls.getObject().quaternion);

                const fwd = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), euler.y);
                const rgt = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), euler.y);

                const stepZ = fwd.multiplyScalar(-velocity.z * delta);
                const stepX = rgt.multiplyScalar(-velocity.x * delta);
                const totalStep = stepZ.add(stepX);

                const nextX = playerPos.x + totalStep.x;
                if (isPointInWalkableZones(nextX, playerPos.z) && !collidesWithObstacle(nextX, playerPos.z)) {
                    playerPos.x = nextX;
                }

                const nextZ = playerPos.z + totalStep.z;
                if (isPointInWalkableZones(playerPos.x, nextZ) && !collidesWithObstacle(playerPos.x, nextZ)) {
                    playerPos.z = nextZ;
                }

                playerPos.y = 8;
            } else if (isMobile) {
                phi = THREE.MathUtils.degToRad(90 - lat);
                theta = THREE.MathUtils.degToRad(lon);
                const targetPosition = new THREE.Vector3();
                targetPosition.x = camera.position.x + 100 * Math.sin(phi) * Math.cos(theta);
                targetPosition.y = camera.position.y + 100 * Math.cos(phi);
                targetPosition.z = camera.position.z + 100 * Math.sin(phi) * Math.sin(theta);
                camera.lookAt(targetPosition);

                const speed = 10.0;
                const forwardVec = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
                forwardVec.y = 0; forwardVec.normalize();

                const rightVec = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
                rightVec.y = 0; rightVec.normalize();

                let moveStep = new THREE.Vector3();
                if (fwdValue > 0) moveStep.addScaledVector(forwardVec, speed * delta * fwdValue);
                if (bkdValue > 0) moveStep.addScaledVector(forwardVec, -speed * delta * bkdValue);
                if (rgtValue > 0) moveStep.addScaledVector(rightVec, speed * delta * rgtValue);
                if (lftValue > 0) moveStep.addScaledVector(rightVec, -speed * delta * lftValue);

                const nextX = playerPos.x + moveStep.x;
                if (isPointInWalkableZones(nextX, playerPos.z) && !collidesWithObstacle(nextX, playerPos.z)) {
                    playerPos.x = nextX;
                }

                const nextZ = playerPos.z + moveStep.z;
                if (isPointInWalkableZones(playerPos.x, nextZ) && !collidesWithObstacle(playerPos.x, nextZ)) {
                    playerPos.z = nextZ;
                }

                playerPos.y = 8;
            }

            prevTime = time;

            // Update Current Room HUD Indicator
            updateRoomIndicator(playerPos.z);

            // Global Camera Yaw for Avatar and 3rd Person View
            const euler = new THREE.Euler(0, 0, 0, 'YXZ');
            if (isMobile) {
                euler.setFromQuaternion(camera.quaternion);
            } else if (controls) {
                euler.setFromQuaternion(controls.getObject().quaternion);
            }

            // --- Avatar Update & Animation Crossfades ---
            if (avatarGroup) {
                avatarGroup.position.set(playerPos.x, 0, playerPos.z);

                let moveDir = new THREE.Vector3();
                if (!isMobile && controls && controls.isLocked) {
                    if (moveForward) moveDir.z = -1;
                    if (moveBackward) moveDir.z = 1;
                    if (moveLeft) moveDir.x = -1;
                    if (moveRight) moveDir.x = 1;
                } else if (isMobile) {
                    if (fwdValue > 0) moveDir.z = -1;
                    if (bkdValue > 0) moveDir.z = 1;
                    if (lftValue > 0) moveDir.x = -1;
                    if (rgtValue > 0) moveDir.x = 1;
                }

                const isMoving = moveDir.lengthSq() > 0;

                if (isMoving) {
                    moveDir.normalize();
                    moveDir.applyAxisAngle(new THREE.Vector3(0, 1, 0), euler.y);

                    const targetAngle = Math.atan2(moveDir.x, moveDir.z);
                    let diff = targetAngle - avatarGroup.rotation.y;
                    diff = Math.atan2(Math.sin(diff), Math.cos(diff));
                    avatarGroup.rotation.y += diff * 14 * delta;

                    if (walkAction && currentAction !== walkAction) {
                        if (currentAction) currentAction.fadeOut(0.2);
                        walkAction.reset().fadeIn(0.2).play();
                        currentAction = walkAction;
                    } else if (!walkAction && currentAction && !currentAction.isRunning()) {
                        currentAction.play();
                    }
                } else {
                    if (idleAction && currentAction !== idleAction) {
                        if (currentAction) currentAction.fadeOut(0.2);
                        idleAction.reset().fadeIn(0.2).play();
                        currentAction = idleAction;
                    }
                }

                if (avatarMixer) {
                    avatarMixer.update(delta);
                }
            }

            // --- 3rd Person Camera Logic with Wall Clipping Protection ---
            let activeCamera = isThirdPerson ? tpCamera : camera;

            if (isThirdPerson) {
                const maxDist = 11.0;
                const dir = new THREE.Vector3(0, 0, 1).applyAxisAngle(new THREE.Vector3(0, 1, 0), euler.y);

                let safeDist = maxDist;
                for (let d = maxDist; d >= 3.0; d -= 1.0) {
                    const testPos = playerPos.clone().add(dir.clone().multiplyScalar(d));
                    if (isPointInWalkableZones(testPos.x, testPos.z, 0.8)) {
                        safeDist = d;
                        break;
                    }
                }

                tpCamera.position.copy(playerPos).add(dir.multiplyScalar(safeDist));
                tpCamera.position.y = playerPos.y + 3.0;

                const targetPoint = new THREE.Vector3(0, 0, -18);
                targetPoint.applyAxisAngle(new THREE.Vector3(0, 1, 0), euler.y);
                targetPoint.add(playerPos);
                targetPoint.y = playerPos.y - 1.5;
                tpCamera.lookAt(targetPoint);
            }

            renderer.render(scene, activeCamera);
        }
    </script>
