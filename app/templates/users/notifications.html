{% extends "base.html" %}

{% block content %}
<div class="pt-32 pb-12 px-4 sm:px-6 lg:px-8 max-w-3xl mx-auto text-white font-sans text-center">
    <div class="inline-flex items-center justify-center w-24 h-24 rounded-full bg-zinc-900 border border-zinc-800 mb-8 shadow-xl shadow-emerald-900/10">
        <svg class="w-10 h-10 text-emerald-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">

        Şu an için hiç yeni bildiriminiz bulunmuyor. Fotoğraf paylaştıkça, beğeni ve yorum aldıkça bildirimleriniz burada toplanacak.
    </p>
    
    <div class="mt-12">
        <a href="{{ url_for('main.index') }}" class="text-emerald-400 font-mono text-xs uppercase tracking-[0.2em] hover:text-white transition-colors">

</div>
