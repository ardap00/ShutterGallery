<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShutterGallery — Fotoğrafın Kalbi [YEDEK]</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; overflow: hidden; background: #000; }
        #bg {
            position: fixed; inset: 0; z-index: 0;
            background: url('https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1920&q=80') center/cover no-repeat;
            filter: blur(20px) brightness(40%);
            transform: scale(1.08);
            transition: filter 1.8s ease-in-out, transform 1.8s ease-in-out;
        }
        @keyframes pulse-green {
            0%, 100% { box-shadow: 0 0 0 0 rgba(74,222,128,0.5); }
            50%       { box-shadow: 0 0 0 14px rgba(74,222,128,0); }
        }
        #power-btn { animation: pulse-green 2s infinite; }
        #power-btn.off { animation: none; opacity: 0 !important; pointer-events: none; }
        #top-nav { opacity: 0; transform: translateY(-12px); transition: opacity 0.8s ease, transform 0.8s ease; pointer-events: none; }
        #top-nav.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }
        #tagline { transition: opacity 0.6s ease; }
    </style>
</head>
<body>
    <div id="bg"></div>
    <canvas id="c" class="fixed inset-0 w-full h-full" style="z-index:10;"></canvas>
    <div id="top-nav" class="fixed top-0 left-0 right-0 flex items-center justify-between px-6 py-4" style="z-index:40;">
        <div class="flex items-center gap-2">
            <span class="text-[#2D3A2A]/50 text-xs tracking-[0.25em] uppercase font-light">ShutterGallery</span>
        </div>
        <div class="flex items-center gap-3">
            <a href="{{ url_for('main.index') }}" class="text-[#2D3A2A]/50 text-xs tracking-wider hover:text-[#2D3A2A]/80 transition-colors duration-200">Misafir Olarak Gez →</a>
            <div class="w-px h-3.5 bg-white/20"></div>
            <a href="{{ url_for('auth.login') }}" class="text-[#2D3A2A]/70 text-xs tracking-wider hover:text-[#2D3A2A] transition-colors duration-200 font-medium">Giriş Yap</a>
            <a href="{{ url_for('auth.register') }}" class="px-3.5 py-1.5 rounded-full bg-white/10 hover:bg-white/20 text-[#2D3A2A] text-xs tracking-wider font-medium transition-all duration-200 border border-white/15 hover:border-white/30">Kayıt Ol</a>
        </div>
    </div>
    <div class="fixed bottom-10 inset-x-0 flex flex-col items-center gap-4" style="z-index:30;">
        <p id="tagline" class="text-[#2D3A2A]/30 text-xs tracking-[0.35em] uppercase font-light">Fotoğrafın Kalbi</p>
        <button id="power-btn" class="flex items-center gap-2.5 px-6 py-2.5 rounded-full border border-green-500/50 bg-white/50 text-green-400 text-xs font-semibold tracking-[0.2em] uppercase hover:bg-green-500/10 hover:border-green-400 transition-colors duration-300" style="backdrop-filter:blur(10px);">
            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M5.636 5.636a9 9 0 1 0 12.728 0M12 3v9"/></svg>
            Sistemi Başlat
        </button>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
    const canvas = document.getElementById('c');
    const scene  = new THREE.Scene();
    const cam    = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 100);
    cam.position.z = 5;
    const renderer = new THREE.WebGLRenderer({ canvas, alpha:true, antialias:true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const dl = new THREE.DirectionalLight(0xffffff, 1.3); dl.position.set(4, 6, 5); scene.add(dl);
    const rl = new THREE.DirectionalLight(0x88aaff, 0.5); rl.position.set(-5, 2, -4); scene.add(rl);
    const g = new THREE.Group();
    const mBody = new THREE.MeshStandardMaterial({ color:0x1c1c1c, roughness:0.4, metalness:0.5 });
    const mLens = new THREE.MeshStandardMaterial({ color:0x080808, roughness:0.15, metalness:0.95 });
    const mGls  = new THREE.MeshStandardMaterial({ color:0x0a1e2e, roughness:0.04, metalness:1, transparent:true, opacity:0.7 });
    const mScr  = new THREE.MeshStandardMaterial({ color:0x050d18, roughness:0.08, emissive:0x0a1628, emissiveIntensity:0.6 });
    const mBtn  = new THREE.MeshStandardMaterial({ color:0x2a2a2a, roughness:0.6 });
    g.add(new THREE.Mesh(new THREE.BoxGeometry(2, 1.3, 0.8), mBody));
    const scrMesh = new THREE.Mesh(new THREE.BoxGeometry(0.95, 0.68, 0.02), mScr); scrMesh.position.set(-0.05, 0, 0.41); g.add(scrMesh);
    const scrFrame = new THREE.Mesh(new THREE.BoxGeometry(1.02, 0.75, 0.015), mLens); scrFrame.position.set(-0.05, 0, 0.405); g.add(scrFrame);
    const vf = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.15, 0.1), mBody); vf.position.set(0.5, 0.72, 0.35); g.add(vf);
    const grip = new THREE.Mesh(new THREE.BoxGeometry(0.34, 1.0, 0.85), mBody); grip.position.set(0.87, -0.05, 0); g.add(grip);
    const sh = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.09, 0.1, 16), mBtn); sh.position.set(0.7, 0.72, 0.1); g.add(sh);
    const lb = new THREE.Mesh(new THREE.CylinderGeometry(0.30, 0.34, 0.7, 32), mLens); lb.rotation.x = Math.PI/2; lb.position.set(-0.14, 0, -0.72); g.add(lb);
    const lr = new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.34, 0.06, 32), mLens); lr.rotation.x = Math.PI/2; lr.position.set(-0.14, 0, -0.42); g.add(lr);
    const lg = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 0.05, 32), mGls); lg.rotation.x = Math.PI/2; lg.position.set(-0.14, 0, -1.05); g.add(lg);
    scene.add(g);
    let targetZ = 5, powered = false, navShown = false, tick = 0;
    const bg = document.getElementById('bg'), powerBtn = document.getElementById('power-btn'), topNav = document.getElementById('top-nav'), tagline = document.getElementById('tagline');
    window.addEventListener('resize', () => { cam.aspect = innerWidth/innerHeight; cam.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
    function animate() {
        requestAnimationFrame(animate); tick += 0.008;
        cam.position.z += (targetZ - cam.position.z) * 0.036;
        if (!powered) { g.rotation.y = Math.sin(tick)*0.05; g.rotation.x = Math.sin(tick*0.55)*0.025; }
        else { g.rotation.y += (0-g.rotation.y)*0.07; g.rotation.x += (0-g.rotation.x)*0.07; if (!navShown && cam.position.z<1.6) { navShown=true; topNav.classList.add('visible'); } }
        renderer.render(scene, cam);
    }
    animate();
    powerBtn.addEventListener('click', () => { if(powered) return; powered=true; bg.style.filter='blur(0px) brightness(85%)'; bg.style.transform='scale(1)'; targetZ=0.65; powerBtn.classList.add('off'); tagline.style.opacity='0'; });
    </script>
</body>
</html>
